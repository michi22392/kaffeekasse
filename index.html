<style>
  :root {
    color-scheme: light dark;
    --bg: #f6efe7;
    --surface: #fffaf4;
    --surface-2: #f1e6d9;
    --text: #2a1c13;
    --muted: #7b6555;
    --border: #e7d9c9;
    --primary: #6b4428;
    --primary-press: #55351e;
    --on-primary: #fff8f0;
    --accent: #c8894e;
    --bar: #b07a4a;
    --debt: #b0391f;
    --debt-bg: #fbe5dd;
    --credit: #2c7543;
    --credit-bg: #e0f0e4;
    --zero: #7b6555;
    --zero-bg: #efe6dc;
    --toast-bg: #2a1c13;
    --toast-fg: #fff8f0;
    --toast-action: #f2be86;
    --shadow: 0 1px 2px rgba(70, 40, 20, .06), 0 6px 18px rgba(70, 40, 20, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17110d;
      --surface: #221912;
      --surface-2: #2e2219;
      --text: #f5ebe0;
      --muted: #b9a390;
      --border: #3a2b20;
      --primary: #c8915a;
      --primary-press: #b47f4b;
      --on-primary: #1c120b;
      --accent: #e3a96b;
      --bar: #c8915a;
      --debt: #ff8c72;
      --debt-bg: #3d1e15;
      --credit: #7fd497;
      --credit-bg: #163020;
      --zero: #b9a390;
      --zero-bg: #2e2219;
      --toast-bg: #f5ebe0;
      --toast-fg: #1c120b;
      --toast-action: #8a4f1f;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(110px + env(safe-area-inset-bottom));
  }
  main { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg { flex: none; }
  [hidden] { display: none !important; }

  /* ---------- Kopfzeile ---------- */
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    min-height: 64px;
    margin: 0 -16px 8px;
    padding: env(safe-area-inset-top) 12px 0 16px;
    background: var(--bg);
  }
  .brand { flex: 1; display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em; }
  .brand-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--on-primary); }
  .page-title { flex: 1; margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em; }
  .bar-title { flex: 1; min-width: 0; margin: 0; font-size: 1.15rem; font-weight: 700; text-align: right; padding-right: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  .back {
    display: inline-flex; align-items: center; gap: 2px; flex: none;
    min-height: 44px; padding: 0 12px 0 4px; margin-left: -6px;
    border: 0; border-radius: 12px; background: transparent;
    color: var(--primary); font-weight: 700; font-size: 1.05rem;
  }
  .icon-btn {
    display: inline-grid; place-items: center;
    width: 44px; height: 44px; flex: none;
    border: 0; border-radius: 12px; background: transparent; color: var(--muted);
  }
  @media (hover: hover) {
    .icon-btn:hover, .back:hover { background: var(--surface-2); }
    .icon-btn.del:hover { color: var(--debt); background: var(--debt-bg); }
  }

  /* ---------- Untere Navigationsleiste ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -4px 16px rgba(70, 40, 20, .05);
  }
  .tabbar-inner { display: flex; max-width: 680px; margin: 0 auto; }
  .tab {
    flex: 1; min-width: 0; min-height: 62px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 6px 0;
    color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 700; letter-spacing: -.01em;
  }
  .tab > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 350px) { .tab { font-size: .6rem; letter-spacing: -.02em; } }
  .tab-ico { position: relative; display: grid; place-items: center; width: 50px; height: 30px; border-radius: 99px; transition: background .15s; }
  .tab-badge {
    position: absolute; top: -5px; right: 0; min-width: 20px; height: 20px; padding: 0 5px;
    display: grid; place-items: center; border-radius: 99px; border: 2px solid var(--surface);
    background: var(--primary); color: var(--on-primary); font-size: .7rem; font-weight: 800; line-height: 1;
  }
  .tab[aria-current="page"] { color: var(--primary); }
  .tab[aria-current="page"] .tab-ico { background: var(--surface-2); }

  /* ---------- Allgemeine Bausteine ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin: 0 0 16px; box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 { margin: 18px 0 8px; font-size: .95rem; font-weight: 700; }
  .count { font-size: .8rem; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 9px; }
  .pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--primary); }
  .pill.credit { background: var(--credit-bg); color: var(--credit); }
  .pill.debt { background: var(--debt-bg); color: var(--debt); }
  .hint { margin: 10px 0 0; font-size: .9rem; color: var(--muted); }
  .empty-note { margin: 4px 0; color: var(--muted); }
  .empty-note a, .notice a { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; }
  .notice { margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: .92rem; }
  .section-title { margin: 0 0 8px; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 18px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); font-weight: 700;
  }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn.primary:active { background: var(--primary-press); }
  .btn.danger { background: var(--debt); color: #fff; border-color: transparent; }
  .btn.danger-outline { background: transparent; color: var(--debt); border-color: currentColor; }
  @media (prefers-color-scheme: dark) { .btn.danger { color: #1c120b; } }
  .btn.small { min-height: 40px; padding: 0 14px; font-size: .95rem; }
  .btn.block { width: 100%; }
  .btn:active { transform: scale(.98); }

  input[type="text"], input[type="search"], textarea {
    width: 100%; min-height: 48px; padding: 0 14px;
    font-size: 17px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  textarea { min-height: 96px; padding: 12px 14px; line-height: 1.4; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  input.invalid { border-color: var(--debt); box-shadow: 0 0 0 3px var(--debt-bg); }
  .money { position: relative; display: block; }
  .hint svg { vertical-align: -2px; }
  .money input { padding-right: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .money span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  .form { display: grid; gap: 16px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field-lbl { font-weight: 700; font-size: .92rem; }
  .field-hint { margin: 0; font-size: .85rem; color: var(--muted); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pct-field { max-width: 160px; }
  .preview { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: .88rem; color: var(--muted); }
  .preview strong { color: var(--text); }
  .preview s { opacity: .75; }

  .switch { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 700; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch-ui { position: relative; flex: none; width: 52px; height: 32px; border-radius: 99px; background: var(--border); transition: background .15s; }
  .switch-ui::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s;
  }
  .switch input:checked + .switch-ui { background: var(--primary); }
  .switch input:checked + .switch-ui::after { transform: translateX(20px); }
  .switch input:focus-visible + .switch-ui { outline: 3px solid var(--accent); outline-offset: 2px; }

  .debt { color: var(--debt); }
  .credit { color: var(--credit); }
  .zero { color: var(--zero); }

  /* ---------- Übersicht ---------- */
  .summary { display: flex; gap: 10px; margin: 0 0 14px; }
  .summary > div { flex: 1; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .sum-lbl { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .sum-amt { display: block; font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  #search { margin-bottom: 12px; background: var(--surface); }

  .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .person-row {
    width: 100%; min-height: 72px;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 10px 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); text-align: left;
  }
  .person-row:active { transform: scale(.99); background: var(--surface-2); }
  @media (hover: hover) { .person-row:hover { border-color: var(--accent); } }
  .avatar {
    display: grid; place-items: center; flex: none;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--av); color: #fff; font-weight: 700; font-size: .95rem;
  }
  .pname { flex: 1; min-width: 0; font-size: 1.1rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbal { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .pbal .amt { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; }
  .debt .tag { background: var(--debt-bg); }
  .credit .tag { background: var(--credit-bg); }
  .zero .tag { background: var(--zero-bg); }
  .chev { color: var(--muted); display: grid; }

  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  .empty-icon { display: inline-grid; place-items: center; width: 80px; height: 80px; border-radius: 24px; background: var(--surface-2); color: var(--primary); margin-bottom: 12px; }
  .empty p { margin: 0 0 18px; font-size: 1.05rem; }

  /* ---------- Detailansicht ---------- */
  .hero {
    text-align: center; padding: 22px 16px 20px; margin: 0 0 16px;
    border-radius: 20px; border: 1px solid var(--border); background: var(--surface);
  }
  .hero.debt { background: var(--debt-bg); border-color: transparent; }
  .hero.credit { background: var(--credit-bg); border-color: transparent; }
  .hero.zero { background: var(--zero-bg); border-color: transparent; }
  .hero-name { color: var(--text); font-size: 1.6rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .hero-note { margin-top: 4px; color: var(--muted); font-size: .95rem; white-space: pre-line; overflow-wrap: anywhere; }
  .hero-amt { margin-top: 6px; font-size: clamp(2.6rem, 13vw, 3.6rem); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero-lbl { margin-top: 4px; font-weight: 700; }
  .hero.bump .hero-amt { animation: bump .35s ease; }
  @keyframes bump { 40% { transform: scale(1.08); } }

  .coffee-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 540px) { .coffee-grid { grid-template-columns: repeat(3, 1fr); } }
  .coffee-btn {
    min-height: 86px; padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 0; border-radius: 16px;
    background: var(--primary); color: var(--on-primary);
    box-shadow: 0 2px 0 rgba(0, 0, 0, .15);
    text-align: center; font-size: 1.05rem; font-weight: 700; line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .coffee-btn .price { font-size: .95rem; font-weight: 500; opacity: .9; font-variant-numeric: tabular-nums; }
  .coffee-btn:active { transform: scale(.96); background: var(--primary-press); }
  .coffee-btn.done { animation: pop .3s ease; }
  @keyframes pop { 0% { transform: scale(.93); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
  @media (hover: hover) { .coffee-btn:hover { filter: brightness(1.08); } }

  .pay-row { display: flex; gap: 10px; }
  .pay-row .money { flex: 1; min-width: 0; }
  .chip {
    margin-top: 10px; min-height: 40px; padding: 6px 14px;
    border: 1px dashed var(--accent); border-radius: 99px;
    background: transparent; color: var(--primary); font-size: .92rem; font-weight: 600;
  }

  .day { margin: 16px 0 2px; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .day:first-child { margin-top: 0; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hrow { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid var(--border); }
  .hist .hrow:first-child { border-top: 0; }
  .hicon { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); color: var(--primary); }
  .hrow.payment .hicon { background: var(--credit-bg); color: var(--credit); }
  .hmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .hlabel { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .htime { font-size: .85rem; color: var(--muted); }
  .hamt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hrow.payment .hamt { color: var(--credit); }

  /* ---------- Bohnen ---------- */
  .bean-active {
    margin: 0 0 18px; padding: 18px;
    background: var(--surface); border: 2px solid var(--accent); border-radius: 20px; box-shadow: var(--shadow);
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 99px; background: var(--surface-2);
    font-size: .76rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--primary);
  }
  .bean-active h2 { margin: 10px 0 0; font-size: 1.45rem; line-height: 1.2; overflow-wrap: anywhere; }
  .bean-roaster { color: var(--muted); font-weight: 600; }
  .grind {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-top: 14px; padding: 12px 16px; border-radius: 14px;
    background: var(--primary); color: var(--on-primary);
  }
  .grind-lbl { font-weight: 700; }
  .grind-val { font-size: 2rem; font-weight: 800; line-height: 1.1; text-align: right; overflow-wrap: anywhere; }
  .bean-notes { margin: 12px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .bean-meta { margin-top: 10px; font-size: .88rem; color: var(--muted); }
  .bean-active .btn { margin-top: 14px; }
  .bean-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .bean-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .bean-main {
    flex: 1; min-width: 0; min-height: 56px; padding: 8px 10px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
    border: 0; border-radius: 12px; background: transparent; text-align: left;
  }
  .bean-main strong { font-size: 1.05rem; overflow-wrap: anywhere; }
  .bean-sub { font-size: .88rem; color: var(--muted); }

  /* ---------- Auswertung ---------- */
  .private { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-size: .8rem; font-weight: 700; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; margin: 0 0 8px; border-radius: 14px; background: var(--surface-2); }
  .seg button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: .92rem; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .period-label { margin: 0 0 14px; text-align: center; color: var(--muted); font-size: .9rem; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 16px; }
  .kpi { min-width: 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .kpi.wide { grid-column: 1 / -1; }
  .kpi .lbl { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); }
  .kpi .val { display: block; margin-top: 2px; font-size: clamp(1.15rem, 5.6vw, 1.5rem); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .sub { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 4px; font-size: .8rem; color: var(--muted); }
  .bd { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .bd-top { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; }
  .bd-name { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bd-val { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bd-track { height: 8px; margin-top: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bd-bar { display: block; height: 100%; border-radius: 99px; background: var(--bar); }

  /* ---------- Einstellungen ---------- */
  .add-form { display: flex; flex-wrap: wrap; gap: 8px; }
  .add-form .grow { flex: 1 1 180px; min-width: 0; }
  .add-form .btn { flex: 1 0 auto; }
  .manage { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .manage li { display: flex; align-items: center; gap: 4px; }
  .manage .grow { flex: 1; min-width: 0; margin-right: 4px; }
  .coffee-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .coffee-item { padding: 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); }
  .coffee-item input { background: var(--surface); }
  .ci-top { display: flex; align-items: center; gap: 8px; }
  .ci-top input { flex: 1; min-width: 0; }
  .ci-prices, .add-coffee { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ci-prices { margin-top: 8px; }
  .add-coffee .full { grid-column: 1 / -1; }
  .mini { display: grid; gap: 4px; min-width: 0; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .mini input { color: var(--text); font-weight: 400; }
  .ci-margin { margin-top: 8px; font-size: .85rem; color: var(--muted); }
  .btn-col { display: grid; gap: 10px; margin-top: 14px; }
  @media (min-width: 540px) { .btn-col { grid-template-columns: 1fr 1fr; } }
  .footer-note { text-align: center; font-size: .82rem; color: var(--muted); margin: 8px 0 0; }

  /* ---------- Auswahlfelder ---------- */
  .select { position: relative; display: block; min-width: 0; }
  .select select {
    width: 100%; min-height: 48px; padding: 0 40px 0 14px;
    font: inherit; font-size: 17px; color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
    -webkit-appearance: none; appearance: none;
  }
  .select::after {
    content: ""; position: absolute; right: 17px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }

  /* ---------- Gruppen & Sortierung ---------- */
  .ov-tools { display: grid; gap: 8px; margin: 0 0 14px; }
  .sort-field { display: flex; align-items: center; gap: 10px; }
  .sort-lbl { flex: none; font-size: .9rem; font-weight: 700; color: var(--muted); }
  .sort-field .select { flex: 1; }
  .sort-field select { min-height: 44px; font-size: 16px; background: var(--surface); }
  .fold-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fold-btns .btn { min-height: 40px; font-size: .9rem; }
  .pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pinfo .pname { flex: none; }
  .psub { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .psub svg { vertical-align: -1px; color: var(--accent); }
  .grp { margin: 0 0 12px; }
  .grp-head {
    width: 100%; min-height: 54px; padding: 8px 14px 8px 10px;
    display: flex; align-items: center; gap: 8px;
    border: 0; border-radius: 14px; background: var(--surface-2); text-align: left;
  }
  .grp-chev { display: grid; color: var(--muted); transition: transform .15s; }
  .grp.collapsed .grp-chev { transform: rotate(-90deg); }
  .grp-name { flex: 1; min-width: 0; font-size: 1.05rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp-meta { display: flex; flex-direction: column; align-items: flex-end; font-size: .8rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .grp-body { padding-top: 10px; }
  .grp.collapsed .grp-body { display: none; }
  .searching .grp.collapsed .grp-body { display: block; }
  .grp-empty { padding: 0 6px; font-size: .9rem; }
  .pick-sec { margin: 0 0 16px; }
  .pick-sec .section-title { margin-left: 4px; }
  .person-row .pill { flex: none; }
  .member-count { display: inline-flex; align-items: center; gap: 4px; flex: none; min-width: 40px; font-size: .85rem; font-weight: 700; color: var(--muted); }

  /* ---------- Bestellungen ---------- */
  .count.big { font-size: .85rem; padding: 4px 12px; }
  .q-summary { padding: 14px 16px; }
  .q-sum { margin: 0; font-size: 1.1rem; font-weight: 800; line-height: 1.35; }
  .q-sub { margin: 2px 0 0; font-size: .88rem; color: var(--muted); }
  .q-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 14px; }
  .queue { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .q-item {
    padding: 6px 10px 10px 2px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .q-item.dragging { position: relative; z-index: 10; border-color: var(--accent); box-shadow: 0 14px 32px rgba(40, 20, 8, .22); }
  .q-item.moved { animation: moved .6s ease; }
  @keyframes moved { 0% { background: var(--surface-2); } 100% { background: var(--surface); } }
  .q-row { display: flex; align-items: center; gap: 4px; }
  .q-handle {
    display: grid; place-items: center; flex: none; width: 36px; height: 52px; border-radius: 10px;
    color: var(--muted); cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .dragging .q-handle { cursor: grabbing; color: var(--primary); }
  .q-num { flex: none; min-width: 30px; font-size: 1.2rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
  .q-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .q-name { font-size: 1.05rem; overflow-wrap: anywhere; }
  .q-drink { font-weight: 600; }
  .q-note { font-size: .85rem; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
  .q-move { display: flex; flex: none; }
  .q-move .icon-btn { width: 42px; color: var(--text); }
  .q-move .icon-btn:disabled { opacity: .22; cursor: default; }
  .q-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .q-acts .btn.primary { min-width: 124px; }
  body.drag-active { -webkit-user-select: none; user-select: none; }

  .pick-person { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 0 4px; }
  .pick-person .pname { font-size: 1.25rem; }
  .pick-person .psub { white-space: normal; }
  .choice-btn {
    position: relative; min-height: 86px; padding: 10px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 2px solid var(--border); border-radius: 16px; background: var(--surface); color: var(--text);
    text-align: center; font-size: 1.05rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere;
  }
  .choice-btn .price { font-size: .95rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .choice-btn .fav { display: inline-flex; align-items: center; gap: 3px; font-size: .72rem; font-weight: 800; color: var(--accent); }
  .choice-btn[aria-checked="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .choice-btn[aria-checked="true"] .price, .choice-btn[aria-checked="true"] .fav { color: inherit; opacity: .92; }
  .qty { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 48px; height: 48px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-size: 1.5rem; font-weight: 700; line-height: 1; }
  .stepper output { min-width: 36px; text-align: center; font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pick-actions { display: grid; gap: 10px; }

  /* ---------- Anmeldung / Start ---------- */
  body.gated #app, body.gated .tabbar, body.gated #warn { display: none; }
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .gate-card { width: 100%; max-width: 440px; text-align: center; }
  .gate-logo { display: inline-grid; place-items: center; width: 84px; height: 84px; margin-bottom: 16px; border-radius: 24px; background: var(--primary); color: var(--on-primary); }
  .gate h1 { margin: 0 0 8px; font-size: 1.6rem; }
  .gate-text { margin: 0 0 20px; color: var(--muted); }
  .gate-text strong { color: var(--text); }
  .gate-error { margin: 16px 0 0; color: var(--debt); font-weight: 600; }
  .gate .btn.block ~ .btn.block { margin-top: 10px; }
  .gate-steps { display: grid; gap: 8px; margin: 0 0 20px; padding-left: 22px; text-align: left; }
  .uid-box { display: grid; justify-items: center; gap: 8px; margin: 0 0 18px; padding: 14px; border-radius: 14px; background: var(--surface-2); }
  .uid-box code { font-size: .95rem; word-break: break-all; -webkit-user-select: all; user-select: all; }
  .uid-lbl { font-size: .8rem; font-weight: 700; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .warn {
    max-width: 680px; margin: 8px auto 0; padding: 10px 14px;
    border-radius: 12px; background: var(--debt-bg); color: var(--debt); font-weight: 600; font-size: .92rem;
  }

  /* ---------- Meldung (Toast) ---------- */
  .toast {
    position: fixed; z-index: 50; left: 50%;
    bottom: calc(78px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px;
    width: max-content; max-width: calc(100vw - 32px);
    padding: 10px 10px 10px 14px; min-height: 52px;
    border-radius: 14px; background: var(--toast-bg); color: var(--toast-fg);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    font-weight: 600;
    opacity: 0; transform: translate(-50%, 16px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast.error { background: var(--debt); color: #fff; }
  @media (prefers-color-scheme: dark) { .toast.error { color: #1c120b; } }
  .toast-icon { display: grid; }
  .toast-msg { padding-right: 4px; }
  .toast-undo {
    min-height: 40px; padding: 0 12px; margin-left: 4px;
    border: 0; border-radius: 10px; background: transparent;
    color: var(--toast-action); font-weight: 800;
  }

  /* ---------- Dialog ---------- */
  dialog {
    width: min(420px, calc(100vw - 32px)); padding: 0;
    border: 0; border-radius: 20px;
    background: var(--surface); color: var(--text);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  }
  dialog::backdrop { background: rgba(30, 18, 10, .5); }
  dialog form { padding: 20px; }
  dialog h2 { margin: 0 0 8px; font-size: 1.2rem; overflow-wrap: anywhere; }
  dialog p { margin: 0; color: var(--muted); }
  dialog p strong { color: var(--text); }
  dialog p .debt, dialog p .credit { display: block; margin-bottom: 6px; }
  .dlg-actions { display: flex; gap: 10px; margin-top: 20px; }
  .dlg-actions .btn { flex: 1; }
</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div id="warn" class="warn" hidden role="status"></div>
<main id="app"></main>

<nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgMsg"></p>
    <div class="dlg-actions">
      <button class="btn" value="cancel">Abbrechen</button>
      <button class="btn primary" value="ok" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<script type="module">
import { firebaseConfig, useEmulator } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {
  getAuth, connectAuthEmulator, onAuthStateChanged, GoogleAuthProvider,
  signInWithPopup, signInWithRedirect, getRedirectResult, signOut,
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {
  initializeFirestore, connectFirestoreEmulator, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, query, where, onSnapshot, writeBatch, serverTimestamp, deleteField, Timestamp,
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
// Offline-Unterstützung: Daten werden auf dem Gerät zwischengespeichert, Änderungen ohne Netz nachgereicht
const db = initializeFirestore(firebaseApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
if (useEmulator) {
  connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectFirestoreEmulator(db, '127.0.0.1', 8080);
}

(function () {
  'use strict';

  // Frühere Versionen speicherten alles im Browser unter diesem Schlüssel (nur noch zur Übernahme)
  const LEGACY_KEY = 'kaffeekasse.v1';
  const LAST_EXPORT_KEY = 'kaffeekasse.letztesBackup';
  const PERIOD_KEY = 'kaffeekasse.zeitraum';
  const SORT_KEY = 'kaffeekasse.sortierung';
  const COLLAPSED_KEY = 'kaffeekasse.eingeklappt';
  const DATA_VERSION = 4;
  const NO_GROUP = '_ohne';
  const NO_GROUP_NAME = 'Ohne Gruppe';
  const DEFAULT_COFFEES = [['Kaffee', 50], ['Espresso', 60], ['Cappuccino', 80], ['Latte Macchiato', 100]];
  const AVATAR_COLORS = ['#8b5a35', '#a0623a', '#6b4428', '#9a7148', '#7a5640', '#b06a45', '#5f7553', '#87683a'];
  const MAX_NAME = 40;
  const MAX_SHORT = 60;
  const MAX_NOTE = 1000;
  const LARGE_PAYMENT = 10000; // ab 100 € wird nachgefragt
  const PERIODS = [['woche', 'Woche'], ['monat', 'Monat'], ['jahr', 'Jahr'], ['gesamt', 'Gesamt']];
  const SORTS = [
    ['schulden', 'Höchste Schulden zuerst'], ['guthaben', 'Höchstes Guthaben zuerst'],
    ['haeufig', 'Am häufigsten bestellt'], ['zuletzt', 'Zuletzt bestellt'], ['name', 'Name (A–Z)'],
  ];
  const MAX_QTY = 10;
  const BUCKET_SIZE = 2000; // Buchungen je Firestore-Dokument (bleibt deutlich unter 1 MB)
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  const $ = (sel, root = document) => root.querySelector(sel);
  const app = $('#app');

  // ---------- Icons ----------
  const svg = (body, size = 22) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const CUP = '<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/>';
  const BEAN = '<g transform="rotate(40 12 12)"><ellipse cx="12" cy="12" rx="6.5" ry="9.5"/><path d="M12 2.5c-2.6 3-2.6 6 0 9.5s2.6 6.5 0 9.5"/></g>';
  const CLIP = '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>';
  const GEAR = '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>';
  const ICON = {
    cup: svg(CUP),
    cupBig: svg(CUP, 40),
    bean: svg(BEAN),
    beanBig: svg(BEAN, 40),
    coin: svg('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.6a4.2 4.2 0 1 0 0 6.8"/><path d="M7.5 10.8h5.5M7.5 13.2h5.5"/>'),
    gear: svg(GEAR, 24),
    gearSmall: svg(GEAR, 20),
    users: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
    chart: svg('<path d="M3 3v18h18"/><path d="M8 17v-5M13 17V7M18 17v-8"/>'),
    lock: svg('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', 16),
    back: svg('<path d="m15 18-6-6 6-6"/>', 26),
    chev: svg('<path d="m9 18 6-6-6-6"/>', 20),
    trash: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/>', 20),
    plus: svg('<path d="M12 5v14M5 12h14"/>', 20),
    download: svg('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>', 20),
    upload: svg('<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>', 20),
    check: svg('<path d="M20 6 9 17l-5-5"/>', 20),
    checkSmall: svg('<path d="M20 6 9 17l-5-5"/>', 14),
    alert: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>', 20),
    alertSmall: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>', 14),
    login: svg('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/>', 20),
    logout: svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>', 20),
    copy: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', 18),
    orders: svg(CLIP),
    ordersBig: svg(CLIP, 40),
    usersSmall: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', 16),
    grip: svg('<g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g>'),
    up: svg('<path d="m18 15-6-6-6 6"/>'),
    down: svg('<path d="m6 9 6 6 6-6"/>'),
    chevDown: svg('<path d="m6 9 6 6 6-6"/>', 20),
    star: svg('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/>', 13),
  };

  // ---------- Formatierung ----------
  const euroFmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  const plainFmt = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: false });
  const numFmt = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
  const dateFmt = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const shortDateFmt = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit' });
  const monthFmt = new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric' });
  const weekdayFmt = new Intl.DateTimeFormat('de-DE', { weekday: 'long' });
  const timeFmt = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' });

  const euro = cents => euroFmt.format(cents / 100);
  const signedEuro = cents => (cents < 0 ? '−' : '') + euro(Math.abs(cents));
  const plain = cents => plainFmt.format(cents / 100);
  const grams = g => (g >= 1000 ? numFmt.format(g / 1000) + ' kg' : g + ' g');
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const cleanName = s => String(s).replace(/\s+/g, ' ').trim().slice(0, MAX_NAME);
  const cleanText = (s, max) => String(s).trim().slice(0, max);
  const sameName = (a, b) => a.toLocaleLowerCase('de') === b.toLocaleLowerCase('de');
  const discountedPrice = (price, discount) => Math.round(price * (100 - discount) / 100);

  // Akzeptiert "1,50", "1.50", "1,5", "2", "2 €", "1.000,50" – Ergebnis in Cent oder null
  function parseAmount(input) {
    let s = String(input).replace(/[\s €]/g, '').replace(/^\+/, '');
    if (!s) return null;
    if (s.includes(',') && s.includes('.')) {
      s = s.lastIndexOf(',') > s.lastIndexOf('.')
        ? s.replace(/\./g, '').replace(',', '.')
        : s.replace(/,/g, '');
    } else {
      s = s.replace(',', '.');
    }
    if (!/^(\d+(\.\d{0,2})?|\.\d{1,2})$/.test(s)) return null;
    const cents = Math.round(parseFloat(s) * 100);
    return Number.isFinite(cents) ? cents : null;
  }

  // Rabatt in Prozent: leer = 0, ungültig = null
  function parsePercent(input) {
    const s = String(input).replace(/[\s %]/g, '').replace(',', '.');
    if (!s) return 0;
    if (!/^\d+(\.\d{0,2})?$/.test(s)) return null;
    const v = parseFloat(s);
    return v >= 0 && v <= 100 ? v : null;
  }

  // Packungsgröße in Gramm ("1000", "1.000 g", "1,5 kg"): leer = null, ungültig = NaN
  function parseGrams(input) {
    let s = String(input).toLowerCase().replace(/[\s ]/g, '');
    if (!s) return null;
    let factor = 1;
    if (s.endsWith('kg')) { factor = 1000; s = s.slice(0, -2); }
    else if (s.endsWith('g')) s = s.slice(0, -1);
    if (factor === 1) s = s.replace(/\./g, '');
    s = s.replace(',', '.');
    if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
    const g = Math.round(parseFloat(s) * factor);
    return g > 0 ? g : NaN;
  }

  function dayLabel(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const prefix = d.toDateString() === today.toDateString() ? 'Heute'
      : d.toDateString() === yesterday.toDateString() ? 'Gestern'
      : weekdayFmt.format(d);
    return `${prefix}, ${dateFmt.format(d)}`;
  }

  // ---------- Daten & Speicher ----------
  function defaultState() {
    return {
      version: DATA_VERSION,
      people: [],
      groups: [],
      coffees: DEFAULT_COFFEES.map(([name, price]) => ({ id: uid(), name, price, cost: null })),
      entries: [],
      orders: [],
      beans: [],
      pauses: [],
      settings: { teamCode: null, sound: false },
    };
  }

  // Prüft geladene bzw. importierte Daten und bringt sie auf das aktuelle Format.
  // Daten aus Version 1 erhalten dabei Standardwerte für die neuen Felder:
  // Rabatt 0 %, keine Notiz, Herstellungskosten "nicht hinterlegt" (null), keine Bohnen.
  // Ab Version 3 zusätzlich: Gruppen, Gruppe und Lieblingsgetränk je Person, offene Bestellungen.
  // Ab Version 4 (Cloud): Pausen und Einstellungen (Team-Code, Hinweiston).
  // keepOrphans: Buchungen behalten, deren Person (noch) nicht bekannt ist – beim Abgleich
  // zwischen Geräten können Buchung und neue Person kurz nacheinander eintreffen.
  function normalize(d, keepOrphans = false) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.people) || !Array.isArray(d.coffees) || !Array.isArray(d.entries)) return null;
    const isId = v => typeof v === 'string' && v.length > 0 && v.length < 64;
    const isCents = v => Number.isInteger(v) && v >= 0;
    const optCents = v => (isCents(v) ? v : null);
    const text = (v, max) => (typeof v === 'string' ? cleanText(v, max) : '');
    const percent = v => (typeof v === 'number' && v >= 0 && v <= 100 ? Math.round(v * 100) / 100 : 0);

    const groups = (Array.isArray(d.groups) ? d.groups : [])
      .filter(g => g && isId(g.id) && typeof g.name === 'string' && cleanName(g.name))
      .map(g => ({ id: g.id, name: cleanName(g.name) }));
    const groupIds = new Set(groups.map(g => g.id));
    const coffees = d.coffees
      .filter(c => c && isId(c.id) && typeof c.name === 'string' && cleanName(c.name) && isCents(c.price))
      .map(c => ({ id: c.id, name: cleanName(c.name), price: c.price, cost: optCents(c.cost) }));
    const coffeeIds = new Set(coffees.map(c => c.id));
    const people = d.people
      .filter(p => p && isId(p.id) && typeof p.name === 'string' && cleanName(p.name))
      .map(p => ({
        id: p.id,
        name: cleanName(p.name),
        discount: percent(p.discount),
        note: text(p.note, MAX_NOTE),
        favoriteCoffeeId: coffeeIds.has(p.favoriteCoffeeId) ? p.favoriteCoffeeId : null,
        groupId: groupIds.has(p.groupId) ? p.groupId : null, // null = "Ohne Gruppe"
      }));
    const personIds = new Set(people.map(p => p.id));
    const entries = d.entries
      .filter(e => e && isId(e.id) && (keepOrphans || personIds.has(e.personId)) && (e.type === 'coffee' || e.type === 'payment') && isCents(e.amount) && Number.isFinite(e.ts))
      .map(e => e.type === 'coffee'
        ? {
            id: e.id,
            personId: e.personId,
            type: 'coffee',
            coffeeId: typeof e.coffeeId === 'string' ? e.coffeeId : null,
            label: (typeof e.label === 'string' && cleanName(e.label)) || 'Kaffee',
            amount: e.amount,                                         // berechneter Preis nach Rabatt
            listPrice: isCents(e.listPrice) ? e.listPrice : e.amount, // Verkaufspreis vor Rabatt
            discount: percent(e.discount),
            cost: optCents(e.cost),                                   // Herstellungskosten; null = unbekannt
            ts: e.ts,
          }
        : { id: e.id, personId: e.personId, type: 'payment', amount: e.amount, ts: e.ts });
    let activeSeen = false;
    const beans = (Array.isArray(d.beans) ? d.beans : [])
      .filter(b => b && isId(b.id) && typeof b.name === 'string' && cleanName(b.name))
      .map(b => {
        const active = b.active === true && !activeSeen;
        if (active) activeSeen = true;
        return {
          id: b.id,
          name: cleanName(b.name),
          roaster: text(b.roaster, MAX_SHORT),
          grind: text(b.grind, MAX_NAME),
          notes: text(b.notes, MAX_NOTE),
          packPrice: optCents(b.packPrice),
          packSize: Number.isInteger(b.packSize) && b.packSize > 0 ? b.packSize : null,
          active,
        };
      });
    // Warteschlange: Reihenfolge im Array = Reihenfolge der Zubereitung
    const orders = (Array.isArray(d.orders) ? d.orders : [])
      .filter(o => o && isId(o.id) && personIds.has(o.personId) && coffeeIds.has(o.coffeeId))
      .map(o => ({ id: o.id, personId: o.personId, coffeeId: o.coffeeId, createdAt: Number.isFinite(o.createdAt) ? o.createdAt : 0 }));
    const pauses = (Array.isArray(d.pauses) ? d.pauses : [])
      .filter(b => b && isId(b.id) && typeof b.time === 'string' && /^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(b.time))
      .map(b => ({ id: b.id, time: b.time, name: text(b.name, MAX_NAME) }));
    const st = d.settings && typeof d.settings === 'object' ? d.settings : {};
    const settings = {
      teamCode: typeof st.teamCode === 'string' && /^[A-Z0-9-]{4,40}$/.test(st.teamCode) ? st.teamCode : null,
      sound: st.sound === true,
    };
    return { version: DATA_VERSION, people, groups, coffees, entries, orders, beans, pauses, settings };
  }

  // ---------- Cloud-Speicher (Firestore) ----------
  // privat/stamm         Kollegen, Gruppen, Sorten, Bohnen, Pausen, Einstellungen (ein Dokument, JSON-Text)
  // buchungen/{monat}    Buchungen und Zahlungen eines Kalendermonats (UTC), je bis zu 2000
  // teams/{code}/bestellungen   die Warteschlange (offene Bestellungen)
  // Beim Speichern wird nur geschrieben, was sich gegenüber dem letzten Stand geändert hat.
  let state = defaultState();
  let ready = false;          // Daten geladen, App sichtbar
  let adminUser = null;       // angemeldetes Google-Konto
  const synced = { stamm: null, buckets: new Map() }; // zuletzt gespeicherter bzw. empfangener Stand

  const stammRef = () => doc(db, 'privat', 'stamm');
  const bucketRef = id => doc(db, 'buchungen', id);
  const teamRef = code => doc(db, 'teams', code);
  const orderCollection = () => collection(db, 'teams', state.settings.teamCode, 'bestellungen');
  const orderRef = id => doc(db, 'teams', state.settings.teamCode, 'bestellungen', id);

  function stammOf(st) {
    return { version: DATA_VERSION, people: st.people, groups: st.groups, coffees: st.coffees, beans: st.beans, pauses: st.pauses, settings: st.settings };
  }

  function bucketsOf(entries) {
    const months = new Map();
    for (const e of entries) {
      const month = new Date(e.ts).toISOString().slice(0, 7);
      if (!months.has(month)) months.set(month, []);
      months.get(month).push(e);
    }
    const buckets = new Map();
    for (const [month, list] of months) {
      list.sort((a, b) => a.ts - b.ts || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
      for (let i = 0; i * BUCKET_SIZE < list.length; i++) {
        buckets.set(i ? `${month}-${i + 1}` : month, JSON.stringify(list.slice(i * BUCKET_SIZE, (i + 1) * BUCKET_SIZE)));
      }
    }
    return buckets;
  }

  function entriesFromBuckets() {
    const all = [];
    for (const json of synced.buckets.values()) {
      try { all.push(...JSON.parse(json)); } catch (e) { console.error('Buchungsmonat nicht lesbar', e); }
    }
    return all;
  }

  // Speichert alle Änderungen gemeinsam mit optionalen weiteren Schreibvorgängen in einem Rutsch
  function save(extra = []) {
    if (!ready) return;
    const writes = [...extra];
    const stamm = JSON.stringify(stammOf(state));
    if (stamm !== synced.stamm) {
      if (stamm.length > 900000) toast('Achtung: Die Stammdaten werden sehr groß (Notizen kürzen).', { error: true });
      synced.stamm = stamm;
      writes.push(['set', stammRef(), { daten: stamm, version: DATA_VERSION, geaendert: serverTimestamp() }]);
    }
    const buckets = bucketsOf(state.entries);
    for (const [id, json] of buckets) {
      if (synced.buckets.get(id) === json) continue;
      synced.buckets.set(id, json);
      writes.push(['set', bucketRef(id), { daten: json, geaendert: serverTimestamp() }]);
    }
    for (const id of [...synced.buckets.keys()]) {
      if (buckets.has(id)) continue;
      synced.buckets.delete(id);
      writes.push(['delete', bucketRef(id)]);
    }
    commit(writes);
    updateOrderBadge();
  }

  // Schreibvorgänge [art, ref, daten] bündeln; offline werden sie später übertragen
  function commit(writes) {
    for (let i = 0; i < writes.length; i += 450) {
      const batch = writeBatch(db);
      for (const [op, ref, data] of writes.slice(i, i + 450)) {
        if (op === 'set') batch.set(ref, data);
        else if (op === 'update') batch.update(ref, data);
        else batch.delete(ref);
      }
      batch.commit().catch(writeFailed);
    }
  }

  function writeFailed(err) {
    console.error(err);
    toast(err && err.code === 'permission-denied'
      ? 'Speichern abgelehnt: keine Berechtigung.'
      : 'Speichern fehlgeschlagen – bitte die Verbindung prüfen.', { error: true });
  }

  function newTeamCode() {
    const bytes = crypto.getRandomValues(new Uint8Array(8));
    const chars = [...bytes].map(b => CODE_CHARS[b % CODE_CHARS.length]).join('');
    return `${chars.slice(0, 4)}-${chars.slice(4)}`;
  }

  let statsPeriod = 'monat';
  try {
    const p = localStorage.getItem(PERIOD_KEY);
    if (PERIODS.some(([k]) => k === p)) statsPeriod = p;
  } catch (e) { /* ignorieren */ }

  // Ansichtseinstellungen der Übersicht (bleiben nach dem Neuladen erhalten)
  let sortMode = 'name';
  let collapsed = new Set();
  try {
    const m = localStorage.getItem(SORT_KEY);
    if (SORTS.some(([k]) => k === m)) sortMode = m;
    const c = JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '[]');
    if (Array.isArray(c)) collapsed = new Set(c.filter(x => typeof x === 'string'));
  } catch (e) { /* ignorieren */ }
  const savePref = (key, value) => { try { localStorage.setItem(key, value); } catch (e) { /* ignorieren */ } };

  const personById = id => state.people.find(p => p.id === id);
  const coffeeById = id => state.coffees.find(c => c.id === id);
  const beanById = id => state.beans.find(b => b.id === id);
  const sortedPeople = () => [...state.people].sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));
  const entriesOf = pid => state.entries.filter(e => e.personId === pid);
  const groupById = id => state.groups.find(g => g.id === id);
  const byName = (a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' });

  // Buchung mit Preis, Rabatt und Herstellungskosten zum Zeitpunkt der Buchung
  const bookingFor = (p, c, ts) => ({
    id: uid(), personId: p.id, type: 'coffee', coffeeId: c.id, label: c.name,
    amount: discountedPrice(c.price, p.discount), listPrice: c.price, discount: p.discount, cost: c.cost, ts,
  });

  // Saldo, Anzahl Kaffees und letzte Buchung je Person in einem Durchlauf
  function personStats() {
    const stats = new Map(state.people.map(p => [p.id, { balance: 0, count: 0, last: 0 }]));
    for (const e of state.entries) {
      const st = stats.get(e.personId);
      if (!st) continue;
      if (e.type === 'coffee') {
        st.balance += e.amount;
        st.count++;
        if (e.ts > st.last) st.last = e.ts;
      } else {
        st.balance -= e.amount;
      }
    }
    return stats;
  }

  function sortPeople(list, mode, stats) {
    const v = p => stats.get(p.id);
    const compare = {
      schulden: (a, b) => v(b).balance - v(a).balance,
      guthaben: (a, b) => v(a).balance - v(b).balance,
      haeufig: (a, b) => v(b).count - v(a).count,
      zuletzt: (a, b) => v(b).last - v(a).last,
    }[mode];
    return [...list].sort((a, b) => (compare ? compare(a, b) : 0) || byName(a, b));
  }

  // Personen nach Gruppen ordnen: Gruppen alphabetisch, "Ohne Gruppe" am Ende (nur wenn belegt)
  function groupSections(people) {
    const sections = [...state.groups].sort(byName).map(g => ({ key: g.id, name: g.name, people: [] }));
    const none = { key: NO_GROUP, name: NO_GROUP_NAME, people: [] };
    const byKey = new Map(sections.map(sec => [sec.key, sec]));
    for (const p of people) (byKey.get(p.groupId) || none).people.push(p);
    return none.people.length ? [...sections, none] : sections;
  }

  const groupOptions = selected => `<option value="">${NO_GROUP_NAME}</option>` +
    [...state.groups].sort(byName).map(g => `<option value="${g.id}"${g.id === selected ? ' selected' : ''}>${esc(g.name)}</option>`).join('');

  // Positiv = Person schuldet etwas, negativ = Guthaben
  function balanceOf(pid) {
    let b = 0;
    for (const e of state.entries) if (e.personId === pid) b += e.type === 'coffee' ? e.amount : -e.amount;
    return b;
  }

  function status(b) {
    if (b > 0) return { cls: 'debt', tag: 'offen', hero: 'schuldet dir' };
    if (b < 0) return { cls: 'credit', tag: 'Guthaben', hero: 'Guthaben' };
    return { cls: 'zero', tag: 'ausgeglichen', hero: 'alles bezahlt' };
  }

  function avatarColor(name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function initials(name) {
    const parts = name.split(' ').filter(Boolean);
    const first = Array.from(parts[0] || '?')[0];
    const last = parts.length > 1 ? Array.from(parts[parts.length - 1])[0] : '';
    return (first + last).toLocaleUpperCase('de');
  }

  const bookingsText = n => n === 0 ? 'keine Buchungen' : n === 1 ? 'eine Buchung' : `${n} Buchungen`;

  // ---------- Meldung ----------
  const toastEl = $('#toast');
  let toastTimer = 0;

  function toast(msg, opts = {}) {
    clearTimeout(toastTimer);
    toastEl.className = 'toast' + (opts.error ? ' error' : '');
    toastEl.innerHTML =
      `<span class="toast-icon">${opts.error ? ICON.alert : ICON.check}</span>` +
      `<span class="toast-msg">${esc(msg)}</span>` +
      (opts.undo ? '<button type="button" class="toast-undo">Rückgängig</button>' : '');
    if (opts.undo) {
      toastEl.querySelector('.toast-undo').addEventListener('click', () => {
        opts.undo();
        toast('Rückgängig gemacht');
      });
    }
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), opts.undo ? 5000 : 2600);
  }

  // ---------- Sicherheitsabfrage ----------
  const dlg = $('#dlg');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close('cancel'); });

  function confirmDialog({ title, html, confirmText = 'OK', danger = false }) {
    if (typeof dlg.showModal !== 'function') {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return Promise.resolve(window.confirm(title + '\n\n' + tmp.textContent));
    }
    $('#dlgTitle').textContent = title;
    $('#dlgMsg').innerHTML = html;
    const ok = $('#dlgOk');
    ok.textContent = confirmText;
    ok.className = 'btn ' + (danger ? 'danger' : 'primary');
    dlg.returnValue = '';
    dlg.showModal();
    return new Promise(resolve => {
      dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok'), { once: true });
    });

  // ---------- Navigation ----------
  const TABS = [
    ['kollegen', '#/', 'Kollegen', ICON.users],
    ['bestellungen', '#/bestellungen', 'Bestellungen', ICON.orders],
    ['bohnen', '#/bohnen', 'Bohnen', ICON.bean],

    ['einstellungen', '#/einstellungen', 'Einstellungen', ICON.gear],

    overview: 'kollegen', person: 'kollegen', personSettings: 'kollegen',
    orders: 'bestellungen', orderPick: 'bestellungen', orderDrink: 'bestellungen',

  let currentView = null;
  let currentId = null;
  let lastHash = null;

  function parseHash() {
    let parts;
    try { parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent); } catch (e) { parts = []; }
    switch (parts[0]) {
      case 'p': return parts[2] === 'einstellungen' ? { view: 'personSettings', id: parts[1] } : { view: 'person', id: parts[1] };
      case 'bestellungen':
        if (parts[1] === 'neu') return parts[2] ? { view: 'orderDrink', id: parts[2] } : { view: 'orderPick' };
        return { view: 'orders' };
      case 'bohnen': return parts[1] ? { view: 'bean', id: parts[1] } : { view: 'beans' };
      case 'auswertung': return { view: 'stats' };
      case 'einstellungen': return { view: 'settings' };
      default: return { view: 'overview' };
    }
  }

  function go(hash) {
    if (location.hash === hash) return;
    try {
      history.pushState({ kk: true }, '', hash);
      onRoute();
    } catch (e) {
      location.hash = hash;
    }
  }

  // Zurück zur vorherigen Seite; wurde die Seite direkt aufgerufen, zur übergeordneten Seite
  function goBack(fallback = '#/') {
    if (history.state && history.state.kk) {
      history.back();
      return;
    }
    try {
      history.replaceState(null, '', fallback);
      onRoute();
    } catch (e) {
      location.replace(fallback);
    }
  }

  // Seite ersetzen statt hinzufügen (Schritte beim Vormerken einer Bestellung)
  function replaceRoute(hash) {
    try {
      history.replaceState(history.state, '', hash);
      onRoute();
    } catch (e) {
      location.replace(hash);
    }
  }

  function onRoute() {
    if (location.hash === lastHash) return;
    pick = null;
    render();
    window.scrollTo(0, 0);
  }

  window.addEventListener('popstate', onRoute);
  window.addEventListener('hashchange', onRoute);

  // ---------- Ansichten ----------
  function render() {
    let r = parseHash();
    const redirect = (hash, route) => {
      try { history.replaceState(null, '', hash); } catch (e) { /* ignorieren */ }
      return route;
    };
    if ((r.view === 'person' || r.view === 'personSettings') && !personById(r.id)) r = redirect('#/', { view: 'overview' });
    if (r.view === 'bean' && r.id !== 'neu' && !beanById(r.id)) r = redirect('#/bohnen', { view: 'beans' });
    if (r.view === 'orderDrink' && !personById(r.id)) r = redirect('#/bestellungen/neu', { view: 'orderPick' });
    lastHash = location.hash;
    currentView = r.view;
    currentId = r.id || null;
    const views = {
      overview: viewOverview, person: viewPerson, personSettings: viewPersonSettings,
      beans: viewBeans, bean: viewBean, stats: viewStats, settings: viewSettings,
      orders: viewOrders, orderPick: viewOrderPick, orderDrink: viewOrderDrink,
    };
    app.innerHTML = views[r.view](r.id);
    updateOrderBadge();
    const activeTab = TAB_OF[r.view];
    tabbar.querySelectorAll('.tab').forEach(t => {
      if (t.dataset.tab === activeTab) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
  }

  // Nach Datenänderung die aktuelle Ansicht auffrischen, ohne die Scrollposition zu verlieren
  function refresh() {
    if (currentView === 'person' && personById(currentId) && $('#hero')) updatePersonView(true);
    else render();
  }

  // ----- Kollegen (Übersicht) -----
  function relativeTime(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return `heute, ${timeFmt.format(d)} Uhr`;
    if (d.toDateString() === yesterday.toDateString()) return `gestern, ${timeFmt.format(d)} Uhr`;
    return `am ${dateFmt.format(d)}`;
  }

  function personRowHtml(p, st) {
    const s = status(st.balance);
    let sub = '';
    if (sortMode === 'haeufig') sub = `${plural(st.count, 'Kaffee', 'Kaffees')} insgesamt`;
    else if (sortMode === 'zuletzt') sub = st.last ? `zuletzt ${relativeTime(st.last)}` : 'noch nichts bestellt';
    return `
        <li data-name="${esc(p.name.toLocaleLowerCase('de'))}">
          <button class="person-row" data-action="open" data-id="${p.id}">
            <span class="avatar" style="--av:${avatarColor(p.name)}">${esc(initials(p.name))}</span>

  function viewOverview() {
    const header = `

      </header>`;

    if (!state.people.length) {
      return header + `
        <div class="empty">
          <div class="empty-icon">${ICON.cupBig}</div>
          <p>Noch keine Kollegen angelegt.</p>
          <button class="btn primary" data-action="settings-add">${ICON.plus}Kollegen hinzufügen</button>
        </div>`;
    }

    const stats = personStats();
    const people = sortPeople(state.people, sortMode, stats);
    let open = 0, credit = 0;
    for (const st of stats.values()) {
      if (st.balance > 0) open += st.balance; else credit -= st.balance;
    }
    const rows = list => `<ul class="people">${list.map(p => personRowHtml(p, stats.get(p.id))).join('')}</ul>`;
    const hasGroups = state.groups.length > 0;
    const list = !hasGroups ? rows(people) : groupSections(people).map(sec => {
      const isCollapsed = collapsed.has(sec.key);
      const groupOpen = sec.people.reduce((sum, p) => sum + Math.max(0, stats.get(p.id).balance), 0);
      return `
        <section class="grp${isCollapsed ? ' collapsed' : ''}" data-group="${sec.key}">

            <span class="grp-chev">${ICON.chevDown}</span>
            <span class="grp-name">${esc(sec.name)}</span>
            <span class="grp-meta">
              <span>${plural(sec.people.length, 'Person', 'Personen')}</span>
              <span class="${groupOpen ? 'debt' : ''}">${groupOpen ? `${euro(groupOpen)} offen` : 'nichts offen'}</span>
            </span>

        </label>
        ${hasGroups ? `
        <div class="fold-btns">
          <button type="button" class="btn small" data-action="expand-all">Alle ausklappen</button>

        </div>` : ''}

  function historyHtml(pid) {
    const list = entriesOf(pid).sort((a, b) => b.ts - a.ts);

  // "3× Cappuccino, 2× Espresso, 1× Kaffee" – häufigste zuerst, sonst in Reihenfolge der Warteschlange
  function orderSummary(orders) {
    const counts = new Map();
    for (const o of orders) {
      const c = coffeeById(o.coffeeId);
      if (!c) continue;
      const item = counts.get(c.id) || { name: c.name, n: 0 };
      item.n++;
      counts.set(c.id, item);
    }
    return [...counts.values()].sort((a, b) => b.n - a.n).map(x => `${x.n}× ${esc(x.name)}`).join(', ');
  }

  // ----- Auswertung (intern) -----
  function periodRange(key) {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    if (key === 'woche') {
      const from = new Date(y, m, now.getDate() - ((now.getDay() + 6) % 7)); // Montag 0:00 Uhr
      const to = new Date(from.getFullYear(), from.getMonth(), from.getDate() + 7);
      const sunday = new Date(to.getFullYear(), to.getMonth(), to.getDate() - 1);
      return { from: +from, to: +to, label: `Diese Woche · ${shortDateFmt.format(from)} – ${dateFmt.format(sunday)}` };
    }
    if (key === 'monat') return { from: +new Date(y, m, 1), to: +new Date(y, m + 1, 1), label: `Dieser Monat · ${monthFmt.format(now)}` };
    if (key === 'jahr') return { from: +new Date(y, 0, 1), to: +new Date(y + 1, 0, 1), label: `Dieses Jahr · ${y}` };
    const first = state.entries.reduce((min, e) => Math.min(min, e.ts), Infinity);
    return { from: -Infinity, to: Infinity, label: first === Infinity ? 'Alle Buchungen' : `Alle Buchungen seit ${dateFmt.format(first)}` };
  }

  function computeStats(range) {
    const s = { revenue: 0, listTotal: 0, cups: 0, cost: 0, unknownCost: 0, payments: 0, paymentCount: 0, bySort: new Map(), byPerson: new Map() };
    for (const e of state.entries) {
      if (e.ts < range.from || e.ts >= range.to) continue;
      if (e.type === 'payment') {
        s.payments += e.amount;
        s.paymentCount++;
        continue;
      }
      s.revenue += e.amount;
      s.listTotal += e.listPrice;
      s.cups++;
      if (e.cost === null) s.unknownCost++;
      else s.cost += e.cost;
      // Nach Sorte gruppieren; umbenannte Sorten erscheinen unter ihrem aktuellen Namen
      const coffee = e.coffeeId && coffeeById(e.coffeeId);
      const key = e.coffeeId || 'name:' + e.label;
      const sort = s.bySort.get(key) || { name: coffee ? coffee.name : e.label, count: 0, revenue: 0 };
      sort.count++;
      sort.revenue += e.amount;
      s.bySort.set(key, sort);
      const person = personById(e.personId);
      const per = s.byPerson.get(e.personId) || { name: person ? person.name : '?', count: 0, revenue: 0 };
      per.count++;
      per.revenue += e.amount;
      s.byPerson.set(e.personId, per);
    }
    s.profit = s.revenue - s.cost;
    s.discountTotal = s.listTotal - s.revenue;
    // Offene Schulden: aktueller Stand aller Kollegen, unabhängig vom Zeitraum
    s.open = 0; s.credit = 0; s.debtors = 0;
    for (const p of state.people) {
      const b = balanceOf(p.id);
      if (b > 0) { s.open += b; s.debtors++; } else s.credit -= b;
    }
    return s;
  }

  function breakdownHtml(title, rows, valueOf, textOf) {
    if (!rows.length) return `<section class="card"><h2>${title}</h2><p class="empty-note">Keine Kaffees in diesem Zeitraum.</p></section>`;
    const max = Math.max(...rows.map(valueOf)) || 1;
    return `
      <section class="card">
        <h2>${title}</h2>
        <ul class="bd">${rows.map(r => `
          <li class="bd-row" title="${esc(r.name)}: ${textOf(r)}">
            <div class="bd-top"><span class="bd-name">${esc(r.name)}</span><span class="bd-val">${textOf(r)}</span></div>
            <div class="bd-track"><span class="bd-bar" style="width:${Math.max(2, valueOf(r) / max * 100).toFixed(1)}%"></span></div>
          </li>`).join('')}
        </ul>
      </section>`;
  }

  function viewStats() {
    const range = periodRange(statsPeriod);
    const s = computeStats(range);
    const kpi = (label, value, sub, cls = '') =>
      `<div class="kpi ${cls}"><span class="lbl">${label}</span><span class="val">${value}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
    const margin = s.revenue ? Math.round(s.profit / s.revenue * 100) : 0;
    const sorts = [...s.bySort.values()].sort((a, b) => b.count - a.count || b.revenue - a.revenue);
    const people = [...s.byPerson.values()].sort((a, b) => b.revenue - a.revenue || b.count - a.count);

    return `
      <header class="bar">
        <h1 class="page-title">Auswertung</h1>
        <span class="private">${ICON.lock}nur für dich</span>
      </header>

      <div class="seg" role="group" aria-label="Zeitraum">
        ${PERIODS.map(([key, label]) => `<button type="button" data-action="period" data-id="${key}" aria-pressed="${key === statsPeriod}">${label}</button>`).join('')}
      </div>
      <p class="period-label">${range.label}</p>

      <div class="kpis">
        ${kpi('Umsatz', euro(s.revenue), `${plural(s.cups, 'Kaffee', 'Kaffees')} · nach Rabatt${s.discountTotal ? ` (${euro(s.discountTotal)} Rabatt)` : ''}`)}
        ${kpi('Erhaltene Zahlungen', euro(s.payments), plural(s.paymentCount, 'Zahlung', 'Zahlungen'))}
        ${kpi('Herstellungskosten', euro(s.cost), s.unknownCost ? `${ICON.alertSmall}${plural(s.unknownCost, 'Kaffee', 'Kaffees')} ohne Angabe` : '')}
        ${kpi('Gewinn', signedEuro(s.profit), s.revenue
          ? (s.profit >= 0 ? `<span class="pill credit">Marge ${margin} %</span>` : `<span class="pill debt">${ICON.alertSmall} Verlust</span>`)
          : '')}
        ${kpi('Offene Schulden aller Kollegen', euro(s.open), `Stand heute · ${plural(s.debtors, 'Person', 'Personen')}${s.credit ? ` · ${euro(s.credit)} Guthaben` : ''}`, 'wide')}
      </div>

      ${s.unknownCost ? `
        <p class="notice">
          ${plural(s.unknownCost, 'Kaffee', 'Kaffees')} in diesem Zeitraum ${s.unknownCost === 1 ? 'hat' : 'haben'} keine Herstellungskosten gespeichert
          (z. B. weil ${s.unknownCost === 1 ? 'er' : 'sie'} vor dieser Funktion gebucht ${s.unknownCost === 1 ? 'wurde' : 'wurden'}). ${s.unknownCost === 1 ? 'Er zählt' : 'Sie zählen'} hier mit 0 €,
          der Gewinn ist also zu hoch angesetzt. <a href="#/einstellungen" data-action="goto-settings">Kosten in den Einstellungen hinterlegen</a> –
          dort kannst du sie auch für ältere Buchungen nachtragen.
        </p>` : ''}

      ${breakdownHtml('Verkauft nach Sorte', sorts, r => r.count, r => `${r.count}× · ${euro(r.revenue)}`)}
      ${breakdownHtml('Umsatz nach Kollege', people, r => r.revenue, r => `${euro(r.revenue)} · ${plural(r.count, 'Kaffee', 'Kaffees')}`)}`;
  }

  // ----- Einstellungen -----
  function lastExportText() {
    let ts = 0;
    try { ts = Number(localStorage.getItem(LAST_EXPORT_KEY)) || 0; } catch (e) { /* ignorieren */ }
    return ts ? `Letztes Backup: ${dateFmt.format(ts)}, ${timeFmt.format(ts)} Uhr` : 'Bisher wurde noch kein Backup erstellt.';
  }

  function marginText(c) {
    return c.cost === null ? 'Herstellungskosten noch nicht hinterlegt' : `Gewinn je Tasse (ohne Rabatt): ${signedEuro(c.price - c.cost)}`;
  }

    const people = sortedPeople();
    const coffees = state.coffees;
    return `
      <header class="bar">
        <h1 class="page-title">Einstellungen</h1>

          <button class="btn primary" type="submit">${ICON.plus}Hinzufügen</button>
        </form>
        ${people.length ? `
          <ul class="manage">${people.map(p => `
            <li>
              <input type="text" class="grow" data-edit="person-name" data-id="${p.id}" value="${esc(p.name)}" maxlength="${MAX_NAME}" autocomplete="off" enterkeyhint="done" aria-label="Name von ${esc(p.name)}">
              <button class="icon-btn" data-action="person-settings" data-id="${p.id}" aria-label="Einstellungen für ${esc(p.name)}" title="Gruppe, Lieblingsgetränk, Rabatt & Notiz">${ICON.gearSmall}</button>
              <button class="icon-btn del" data-action="del-person" data-id="${p.id}" aria-label="${esc(p.name)} löschen" title="Löschen">${ICON.trash}</button>
            </li>`).join('')}
          </ul>
          <p class="hint">Zum Umbenennen in den Namen tippen. Über das Zahnrad legst du Gruppe, Lieblingsgetränk, Rabatt und Notiz fest.</p>` : ''}
      </section>

      <section class="card">
        <h2>Gruppen <span class="count">${state.groups.length}</span></h2>
        <form class="add-form" data-form="add-group" novalidate>
          <input type="text" id="newGroup" class="grow" placeholder="z. B. Büro, Werkstatt, Schicht A" maxlength="${MAX_NAME}" autocomplete="off" enterkeyhint="done" aria-label="Name der neuen Gruppe">
          <button class="btn primary" type="submit">${ICON.plus}Hinzufügen</button>
        </form>
        ${state.groups.length ? `
          <ul class="manage">${[...state.groups].sort(byName).map(g => {
            const n = state.people.filter(p => p.groupId === g.id).length;
            return `
            <li>
              <input type="text" class="grow" data-edit="group-name" data-id="${g.id}" value="${esc(g.name)}" maxlength="${MAX_NAME}" autocomplete="off" enterkeyhint="done" aria-label="Name der Gruppe ${esc(g.name)}">
              <span class="member-count" title="${plural(n, 'Person', 'Personen')}">${ICON.usersSmall}${n}</span>
              <button class="icon-btn del" data-action="del-group" data-id="${g.id}" aria-label="Gruppe ${esc(g.name)} löschen" title="Löschen">${ICON.trash}</button>
            </li>`;
          }).join('')}
          </ul>` : ''}
        <p class="hint">Personen ordnest du über das Zahnrad einer Gruppe zu. Wer keine Gruppe hat, steht unter „${NO_GROUP_NAME}“. Beim Löschen einer Gruppe bleiben alle Personen erhalten.</p>
      </section>

      <section class="card">
        <h2>Kaffeesorten <span class="count">${coffees.length}</span></h2>
        ${coffees.length ? `
          <ul class="coffee-items">${coffees.map(c => `
            <li class="coffee-item">
              <div class="ci-top">
                <input type="text" data-edit="coffee-name" data-id="${c.id}" value="${esc(c.name)}" maxlength="${MAX_NAME}" autocomplete="off" enterkeyhint="done" aria-label="Name der Sorte ${esc(c.name)}">
                <button class="icon-btn del" data-action="del-coffee" data-id="${c.id}" aria-label="${esc(c.name)} löschen" title="Löschen">${ICON.trash}</button>
              </div>
              <div class="ci-prices">
                <label class="mini">Verkaufspreis
                  <span class="money"><input type="text" data-edit="coffee-price" data-id="${c.id}" value="${plain(c.price)}" inputmode="decimal" autocomplete="off" enterkeyhint="done"><span aria-hidden="true">€</span></span>
                </label>
                <label class="mini">Herstellungskosten
                  <span class="money"><input type="text" data-edit="coffee-cost" data-id="${c.id}" value="${c.cost !== null ? plain(c.cost) : ''}" placeholder="–" inputmode="decimal" autocomplete="off" enterkeyhint="done"><span aria-hidden="true">€</span></span>
                </label>
              </div>
              <div class="ci-margin">${marginText(c)}</div>
            </li>`).join('')}
          </ul>` : '<p class="empty-note">Noch keine Sorten angelegt.</p>'}
        <p class="hint">Name, Preis und Kosten lassen sich direkt ändern. Änderungen gelten nur für neue Buchungen – bereits gebuchte Kaffees behalten ihre damaligen Werte.</p>
        <p class="hint">${ICON.lock} Herstellungskosten siehst nur du: hier und in der Auswertung, nie in der Buchungsansicht.</p>
        <h3>Neue Sorte</h3>
        <form class="add-coffee" data-form="add-coffee" novalidate>

          <label class="mini">Verkaufspreis
            <span class="money"><input type="text" id="newCoffeePrice" inputmode="decimal" placeholder="0,00" autocomplete="off"><span aria-hidden="true">€</span></span>
          </label>
          <label class="mini">Herstellungskosten
            <span class="money"><input type="text" id="newCoffeeCost" inputmode="decimal" placeholder="optional" autocomplete="off" enterkeyhint="done"><span aria-hidden="true">€</span></span>

          <button class="btn primary full" type="submit">${ICON.plus}Hinzufügen</button>
