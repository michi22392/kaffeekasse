      </section>

      <section class="card">
        <h2>Konto</h2>
        <p class="hint" style="margin-top:0">Angemeldet als <strong>${esc(adminUser ? adminUser.email || adminUser.displayName || '' : '')}</strong>. Deine Daten liegen geschützt in deiner Firebase-Datenbank und sind auf allen Geräten verfügbar, auf denen du dich anmeldest.</p>
        <div class="btn-col"><button class="btn" data-action="logout">${ICON.logout}Abmelden</button></div>
      </section>

      <section class="card">
        <h2>Datensicherung</h2>
        <p class="hint" style="margin-top:0">Ein Backup als Datei ist eine zusätzliche Sicherheit, z. B. bevor du größere Änderungen machst. Beim Import werden alle Daten durch das Backup ersetzt.</p>
        <p class="hint">${lastExportText()}</p>
        <div class="btn-col">
          <button class="btn" data-action="export">${ICON.download}Backup exportieren</button>
          <button class="btn" data-action="import">${ICON.upload}Backup importieren</button>
        </div>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </section>

      <p class="footer-note">${people.length} Kollegen · ${bookingsText(state.entries.length)} · ${plural(state.beans.length, 'Bohne', 'Bohnen')}</p>`;
  }

  // ---------- Aktionen ----------
  function markInvalid(input) {
    input.classList.add('invalid');
    input.focus();
  }

  let lastBooking = { id: null, t: 0 };

  function book(coffeeId, btn) {
    const p = personById(currentId);
    const c = coffeeById(coffeeId);
    if (!p || !c) return;
    // versehentlichen Doppeltipp abfangen
    const now = Date.now();
    if (lastBooking.id === coffeeId && now - lastBooking.t < 300) return;
    lastBooking = { id: coffeeId, t: now };

    const entry = bookingFor(p, c, now);
    state.entries.push(entry);
    save();
    updatePersonView(true);
    btn.classList.remove('done');
    void btn.offsetWidth;
    btn.classList.add('done');
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { /* ignorieren */ } }
    toast(`${c.name} hinzugefügt`, { undo: () => removeEntry(entry.id) });
  }

  function removeEntry(id) {
    const i = state.entries.findIndex(e => e.id === id);
    if (i < 0) return;
    state.entries.splice(i, 1);
    save();
    refresh();
  }

  async function submitPayment() {
    const p = personById(currentId);
    const input = $('#payInput');
    if (!p || !input) return;
    const cents = parseAmount(input.value);
    if (cents === null || cents <= 0) {
      markInvalid(input);
      toast('Bitte einen gültigen Betrag eingeben, z. B. 5,00', { error: true });
      return;
    }
    if (cents >= LARGE_PAYMENT) {
      const ok = await confirmDialog({
        title: 'Großer Betrag',
        html: `Wirklich eine Zahlung über <strong>${euro(cents)}</strong> für ${esc(p.name)} erfassen?`,
        confirmText: 'Ja, erfassen',
      });
      if (!ok || !personById(p.id)) return;
    }
    const entry = { id: uid(), personId: p.id, type: 'payment', amount: cents, ts: Date.now() };
    state.entries.push(entry);
    save();
    input.value = '';
    input.blur();
    updatePersonView(true);
    toast(`Zahlung über ${euro(cents)} erfasst`, { undo: () => removeEntry(entry.id) });
  }

  async function deleteEntry(id) {
    const e = state.entries.find(x => x.id === id);
    if (!e) return;
    const label = e.type === 'coffee' ? e.label : 'Zahlung';
    const ok = await confirmDialog({
      title: 'Eintrag löschen?',
      html: `<strong>${esc(label)}</strong> über ${euro(e.amount)} vom ${dateFmt.format(e.ts)}, ${timeFmt.format(e.ts)} Uhr wird aus dem Verlauf entfernt. Der Schuldenstand wird entsprechend angepasst.`,
      confirmText: 'Löschen',
      danger: true,
    });
    if (!ok) return;
    removeEntry(id);
    toast('Eintrag gelöscht', {
      undo: () => { state.entries.push(e); save(); refresh(); },
    });
  }

  function addPerson() {
    const input = $('#newPerson');
    const name = cleanName(input.value);
    if (!name) {
      markInvalid(input);
      toast('Bitte einen Namen eingeben.', { error: true });
      return;
    }
    if (state.people.some(p => sameName(p.name, name))) {
      markInvalid(input);
      toast(`„${name}“ gibt es schon.`, { error: true });
      return;
    }
    const groupSelect = $('#newPersonGroup');
    lastAddGroup = groupSelect && groupById(groupSelect.value) ? groupSelect.value : null;
    state.people.push({ id: uid(), name, discount: 0, note: '', favoriteCoffeeId: null, groupId: lastAddGroup });
    save();
    render();
    $('#newPerson').focus();
    toast(`${name} hinzugefügt`);
  }

  function savePersonSettings() {
    const p = personById(currentId);
    if (!p) return;
    const nameInput = $('#psName');
    const discountInput = $('#psDiscount');
    const name = cleanName(nameInput.value);
    if (!name) {
      markInvalid(nameInput);
      toast('Bitte einen Namen eingeben.', { error: true });
      return;
    }
    if (state.people.some(x => x.id !== p.id && sameName(x.name, name))) {
      markInvalid(nameInput);
      toast(`„${name}“ gibt es schon.`, { error: true });
      return;
    }
    const discount = parsePercent(discountInput.value);
    if (discount === null) {
      markInvalid(discountInput);
      toast('Rabatt bitte zwischen 0 und 100 % angeben.', { error: true });
      return;
    }
    p.name = name;
    p.discount = discount;
    p.note = cleanText($('#psNote').value, MAX_NOTE);
    const groupSelect = $('#psGroup');
    if (groupSelect) p.groupId = groupById(groupSelect.value) ? groupSelect.value : null;
    const favorite = $('#psFav').value;
    p.favoriteCoffeeId = coffeeById(favorite) ? favorite : null;
    save();
    toast(`${name} gespeichert`);
    goBack('#/p/' + encodeURIComponent(p.id));
  }

  async function deletePerson(id) {
    const p = personById(id);
    if (!p) return;
    const b = balanceOf(id);
    const removed = entriesOf(id);
    const n = removed.length;
    let html;
    if (b > 0) {
      html = `<strong class="debt">Achtung: ${esc(p.name)} schuldet dir noch ${euro(b)}!</strong>` +
        `Beim Löschen gehen der offene Betrag und ${n === 1 ? 'die Buchung' : `alle ${n} Buchungen`} verloren.`;
    } else if (b < 0) {
      html = `<strong class="credit">${esc(p.name)} hat noch ${euro(-b)} Guthaben.</strong>` +
        `Beim Löschen gehen das Guthaben und ${n === 1 ? 'die Buchung' : `alle ${n} Buchungen`} verloren.`;
    } else {
      html = `${esc(p.name)} wird mit ${n ? (n === 1 ? 'der einen Buchung' : `allen ${n} Buchungen`) : 'dem leeren Verlauf'} gelöscht. Der Saldo ist ausgeglichen.`;
    }
    const openOrders = state.orders.filter(o => o.personId === id);
    if (openOrders.length) html += `<br><br>${plural(openOrders.length, 'offene Bestellung wird', 'offene Bestellungen werden')} storniert.`;
    const ok = await confirmDialog({
      title: `${p.name} löschen?`,
      html,
      confirmText: b !== 0 ? 'Trotzdem löschen' : 'Löschen',
      danger: true,
    });
    if (!ok) return;
    const removedOrders = state.orders.filter(o => o.personId === id);
    state.people = state.people.filter(x => x.id !== id);
    state.entries = state.entries.filter(e => e.personId !== id);
    save(removedOrders.map(o => ['delete', orderRef(o.id)]));
    refresh();
    toast(`${p.name} gelöscht`, {
      undo: () => {
        state.people.push(p);
        state.entries.push(...removed);
        save(removedOrders.map(o => ['set', orderRef(o.id), restorable(o)]));
        refresh();
      },
    });
  }

  function addCoffee() {
    const nameInput = $('#newCoffeeName');
    const priceInput = $('#newCoffeePrice');
    const costInput = $('#newCoffeeCost');
    const name = cleanName(nameInput.value);
    const price = parseAmount(priceInput.value);
    const cost = costInput.value.trim() ? parseAmount(costInput.value) : null;
    if (!name) {
      markInvalid(nameInput);
      toast('Bitte einen Namen für die Sorte eingeben.', { error: true });
      return;
    }
    if (state.coffees.some(c => sameName(c.name, name))) {
      markInvalid(nameInput);
      toast(`„${name}“ gibt es schon.`, { error: true });
      return;
    }
    if (price === null) {
      markInvalid(priceInput);
      toast('Bitte einen gültigen Preis eingeben, z. B. 0,80', { error: true });
      return;
    }
    if (cost === null && costInput.value.trim()) {
      markInvalid(costInput);
      toast('Ungültige Herstellungskosten – bitte z. B. 0,25 eingeben.', { error: true });
      return;
    }
    state.coffees.push({ id: uid(), name, price, cost });
    save();
    render();
    toast(`${name} (${euro(price)}) hinzugefügt`);
  }

  async function deleteCoffee(id) {
    const c = coffeeById(id);
    if (!c) return;
    const openOrders = state.orders.filter(o => o.coffeeId === id).length;
    const fans = state.people.filter(p => p.favoriteCoffeeId === id);
    const ok = await confirmDialog({
      title: `„${c.name}“ löschen?`,
      html: 'Die Sorte verschwindet aus der Auswahl. Bereits gebuchte Kaffees dieser Sorte bleiben im Verlauf mit ihrem damaligen Preis erhalten.' +
        (openOrders ? `<br><br>${plural(openOrders, 'offene Bestellung wird', 'offene Bestellungen werden')} storniert.` : '') +
        (fans.length ? `<br><br>Bei ${plural(fans.length, 'Person', 'Personen')} wird das Lieblingsgetränk entfernt.` : ''),
      confirmText: 'Löschen',
      danger: true,
    });
    if (!ok) return;
    const idx = state.coffees.indexOf(c);
    const removedOrders = state.orders.filter(o => o.coffeeId === id);
    state.coffees.splice(idx, 1);
    fans.forEach(p => { p.favoriteCoffeeId = null; });
    save(removedOrders.map(o => ['delete', orderRef(o.id)]));
    refresh();
    toast(`${c.name} gelöscht`, {
      undo: () => {
        state.coffees.splice(Math.min(idx, state.coffees.length), 0, c);
        fans.forEach(p => { if (p.favoriteCoffeeId === null) p.favoriteCoffeeId = c.id; });
        save(removedOrders.map(o => ['set', orderRef(o.id), restorable(o)]));
        refresh();
      },
    });
  }

  // Buchungen von vor dieser Funktion haben keine Herstellungskosten; auf Wunsch nachtragen
  async function offerCostBackfill(c) {
    const cost = c.cost;
    const missing = state.entries.filter(e => e.type === 'coffee' && e.coffeeId === c.id && e.cost === null);
    if (cost === null || !missing.length) return;
    const ok = await confirmDialog({
      title: 'Ältere Buchungen ergänzen?',
      html: `Für <strong>${plural(missing.length, 'gebuchten Kaffee', 'gebuchte Kaffees')}</strong> „${esc(c.name)}“ sind noch keine Herstellungskosten gespeichert. Sollen <strong>${euro(cost)}</strong> auch dafür übernommen werden?<br><br>Das betrifft nur die Auswertung – Schuldenstände ändern sich nicht.`,
      confirmText: 'Übernehmen',
    });
    if (!ok) return;
    for (const e of missing) if (e.cost === null) e.cost = cost;
    save();
    toast(`Kosten für ${plural(missing.length, 'Buchung', 'Buchungen')} nachgetragen`);
  }

  // Direktes Bearbeiten in den Einstellungen (wird beim Verlassen des Feldes gespeichert)
  function onEdit(t) {
    const id = t.dataset.id;
    const kind = t.dataset.edit;
    if (kind === 'person-name' || kind === 'coffee-name' || kind === 'group-name') {
      const isPerson = kind === 'person-name';
      const isGroup = kind === 'group-name';
      const list = isPerson ? state.people : isGroup ? state.groups : state.coffees;
      const item = list.find(x => x.id === id);
      if (!item) return;
      const name = cleanName(t.value);
      if (!name) {
        t.value = item.name;
        toast('Der Name darf nicht leer sein.', { error: true });
        return;
      }
      if (name === item.name) { t.value = name; return; }
      if (list.some(x => x.id !== id && sameName(x.name, name)) || (isGroup && sameName(name, NO_GROUP_NAME))) {
        t.value = item.name;
        toast(`„${name}“ gibt es schon.`, { error: true });
        return;
      }
      item.name = name;
      t.value = name;
      save();
      toast(isPerson ? 'Name geändert' : isGroup ? `Gruppe umbenannt in „${name}“` : `Sorte umbenannt in „${name}“`);
      return;
    }
    const c = coffeeById(id);
    if (!c) return;
    const marginEl = t.closest('.coffee-item').querySelector('.ci-margin');
    if (kind === 'coffee-price') {
      const cents = parseAmount(t.value);
      if (cents === null) {
        t.value = plain(c.price);
        toast('Ungültiger Preis – bitte z. B. 0,80 eingeben.', { error: true });
        return;
      }
      t.value = plain(cents);
      if (cents === c.price) return;
      c.price = cents;
      save();
      marginEl.textContent = marginText(c);
      toast(`Neuer Preis für ${c.name}: ${euro(cents)}`);
    } else if (kind === 'coffee-cost') {
      const raw = t.value.trim();
      const cents = raw ? parseAmount(raw) : null;
      if (raw && cents === null) {
        t.value = c.cost !== null ? plain(c.cost) : '';
        toast('Ungültige Kosten – bitte z. B. 0,25 eingeben.', { error: true });
        return;
      }
      t.value = cents !== null ? plain(cents) : '';
      if (cents === c.cost) return;
      c.cost = cents;
      save();
      marginEl.textContent = marginText(c);
      toast(cents === null ? `Herstellungskosten für ${c.name} entfernt` : `Herstellungskosten für ${c.name}: ${euro(cents)}`);
      offerCostBackfill(c);
    }
  }

  function saveBean() {
    const nameInput = $('#bName');
    const priceInput = $('#bPrice');
    const sizeInput = $('#bSize');
    const name = cleanName(nameInput.value);
    if (!name) {
      markInvalid(nameInput);
      toast('Bitte einen Namen für die Bohne eingeben.', { error: true });
      return;
    }
    let packPrice = null;
    if (priceInput.value.trim()) {
      packPrice = parseAmount(priceInput.value);
      if (packPrice === null) {
        markInvalid(priceInput);
        toast('Ungültiger Kaufpreis – bitte z. B. 12,90 eingeben.', { error: true });
        return;
      }
    }
    const packSize = parseGrams(sizeInput.value);
    if (Number.isNaN(packSize)) {
      markInvalid(sizeInput);
      toast('Packungsgröße bitte in Gramm angeben, z. B. 1000.', { error: true });
      return;
    }
    const data = {
      name,
      roaster: cleanText($('#bRoaster').value, MAX_SHORT),
      grind: cleanText($('#bGrind').value, MAX_NAME),
      notes: cleanText($('#bNotes').value, MAX_NOTE),
      packPrice,
      packSize,
      active: $('#bActive').checked,
    };
    if (data.active) state.beans.forEach(b => { b.active = false; });
    if (currentId === 'neu') state.beans.push({ id: uid(), ...data });
    else Object.assign(beanById(currentId), data);
    save();
    toast(`${name} gespeichert`);
    goBack('#/bohnen');
  }

  function activateBean(id) {
    const bean = beanById(id);
    if (!bean) return;
    const previous = state.beans.find(b => b.active);
    state.beans.forEach(b => { b.active = b === bean; });
    save();
    render();
    window.scrollTo(0, 0);
    toast(`${bean.name} in Benutzung${bean.grind ? ` – Mahlgrad ${bean.grind}` : ''}`, {
      undo: () => {
        state.beans.forEach(b => { b.active = b === previous; });
        save();
        refresh();
      },
    });
  }

  async function deleteBean(id) {
    const bean = beanById(id);
    if (!bean) return;
    const ok = await confirmDialog({
      title: `„${bean.name}“ löschen?`,
      html: 'Die Bohne wird mit allen Notizen aus deiner Liste entfernt.',
      confirmText: 'Löschen',
      danger: true,
    });
    if (!ok) return;
    const idx = state.beans.indexOf(bean);
    state.beans.splice(idx, 1);
    save();
    const undo = () => {
      if (bean.active) state.beans.forEach(b => { b.active = false; });
      state.beans.splice(Math.min(idx, state.beans.length), 0, bean);
      save();
      refresh();
    };
    if (currentView === 'bean') goBack('#/bohnen');
    else refresh();
    toast(`${bean.name} gelöscht`, { undo });
  }

  // ---------- Gruppen ----------
  function addGroup() {
    const input = $('#newGroup');
    const name = cleanName(input.value);
    if (!name) {
      markInvalid(input);
      toast('Bitte einen Namen für die Gruppe eingeben.', { error: true });
      return;
    }
    if (sameName(name, NO_GROUP_NAME) || state.groups.some(g => sameName(g.name, name))) {
      markInvalid(input);
      toast(`„${name}“ gibt es schon.`, { error: true });
      return;
    }
    state.groups.push({ id: uid(), name });
    save();
    render();
    $('#newGroup').focus();
    toast(`Gruppe „${name}“ angelegt`);
  }

  async function deleteGroup(id) {
    const g = groupById(id);
    if (!g) return;
    const members = state.people.filter(p => p.groupId === id);
    const ok = await confirmDialog({
      title: `Gruppe „${g.name}“ löschen?`,
      html: members.length
        ? `${plural(members.length, 'Person wird', 'Personen werden')} nach „${NO_GROUP_NAME}“ verschoben. Es wird niemand gelöscht.`
        : 'Die Gruppe ist leer.',
      confirmText: 'Gruppe löschen',
      danger: true,
    });
    if (!ok) return;
    const idx = state.groups.indexOf(g);
    state.groups.splice(idx, 1);
    members.forEach(p => { p.groupId = null; });
    save();
    refresh();
    toast(`Gruppe „${g.name}“ gelöscht`, {
      undo: () => {
        state.groups.splice(Math.min(idx, state.groups.length), 0, g);
        members.forEach(p => { if (p.groupId === null) p.groupId = g.id; });
        save();
        refresh();
      },
    });
  }

  function toggleGroup(key, btn) {
    const section = btn.closest('.grp');
    const isCollapsed = !section.classList.contains('collapsed');
    section.classList.toggle('collapsed', isCollapsed);
    btn.setAttribute('aria-expanded', String(!isCollapsed));
    if (isCollapsed) collapsed.add(key); else collapsed.delete(key);
    savePref(COLLAPSED_KEY, JSON.stringify([...collapsed]));
  }

  function setAllGroups(collapse) {
    collapsed = collapse ? new Set(groupSections(state.people).map(sec => sec.key)) : new Set();
    savePref(COLLAPSED_KEY, JSON.stringify([...collapsed]));
    render();
  }

  // ---------- Bestellungen ----------
  // Die Warteschlange liegt in Firestore. Jede Änderung wird geschrieben und kommt über den
  // Echtzeit-Listener sofort zurück (auch offline). Reihenfolge: Feld "pos", sonst Eingangszeit.
  let ordersUnsub = null;
  let pendingFocus = null;
  let ordersDirty = false;

  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const todayKey = () => dateKey(new Date());
  const orderKey = o => (o.pos !== null ? o.pos : o.erstellt);
  const compareOrders = (a, b) => orderKey(a) - orderKey(b) || a.erstellt - b.erstellt || (a.id < b.id ? -1 : 1);
  const vibrate = () => { if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { /* ignorieren */ } } };

  function orderFromDoc(snap) {
    const x = snap.data({ serverTimestamps: 'estimate' });
    return {
      id: snap.id,
      personId: x.personId,
      coffeeId: x.sorteId,
      pauseId: x.pauseId || null,
      datum: x.datum,
      uid: x.uid,
      quelle: x.quelle,
      erstellt: x.erstellt && typeof x.erstellt.toMillis === 'function' ? x.erstellt.toMillis() : Date.now(),
      pos: typeof x.pos === 'number' ? x.pos : null,
    };
  }

  // Für "Rückgängig": die Bestellung so wiederherstellen, wie sie war
  const restorable = o => ({
    personId: o.personId, sorteId: o.coffeeId, pauseId: o.pauseId, datum: o.datum, uid: o.uid,
    status: 'offen', quelle: o.quelle, erstellt: Timestamp.fromMillis(o.erstellt),
    ...(o.pos !== null ? { pos: o.pos } : {}),
  });

  function startOrders() {
    if (ordersUnsub) ordersUnsub();
    state.orders = [];
    ordersUnsub = onSnapshot(query(orderCollection(), where('status', '==', 'offen')), snap => {
      state.orders = snap.docs.map(orderFromDoc).sort(compareOrders);
      ordersChanged();
    }, err => console.error('Bestellungen', err));
  }

  function ordersChanged() {
    updateOrderBadge();
    if (!ready) return;
    if (drag) { ordersDirty = true; return; }
    if (currentView === 'orders' || currentView === 'orderPick') render();
    applyPendingFocus();
  }

  function applyPendingFocus() {
    if (!pendingFocus || currentView !== 'orders') return;
    const item = app.querySelector(`.q-item[data-id="${pendingFocus.id}"]`);
    if (item) {
      item.classList.add('moved');
      const same = pendingFocus.action && item.querySelector(`[data-action="${pendingFocus.action}"]`);
      if (same) (!same.disabled ? same : item.querySelector('[data-action="order-done"]')).focus({ preventScroll: true });
    }
    pendingFocus = null;
  }

  // Neue Reihenfolge speichern: nur Einträge, deren Position sich ändert
  function reposition(list) {
    const writes = [];
    list.forEach((o, i) => { if (o.pos !== i) writes.push(['update', orderRef(o.id), { pos: i }]); });
    commit(writes);
  }

  function placeOrder(more) {
    const p = personById(currentId);
    const c = pick && coffeeById(pick.coffeeId);
    if (!p || !c) {
      toast('Bitte zuerst ein Getränk auswählen.', { error: true });
      return;
    }
    const now = Date.now();
    const refs = [];
    for (let i = 0; i < pick.qty; i++) refs.push(doc(orderCollection()));
    commit(refs.map((ref, i) => ['set', ref, {
      personId: p.id, sorteId: c.id, pauseId: null, datum: todayKey(), uid: adminUser.uid,
      status: 'offen', quelle: 'admin', erstellt: serverTimestamp(), pos: now + i,
    }]));
    const undo = () => commit(refs.map(ref => ['delete', ref]));
    const msg = `${refs.length > 1 ? refs.length + '× ' : ''}${c.name} für ${p.name} vorgemerkt`;
    if (more) {
      pick.qty = 1;
      updatePickUi();
    } else {
      goBack('#/bestellungen');
    }
    toast(msg, { undo });
  }

  function moveOrder(id, dir) {
    const list = state.orders.slice();
    const i = list.findIndex(o => o.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    pendingFocus = { id, action: dir < 0 ? 'order-up' : 'order-down' };
    reposition(list);
  }

  // "Fertig": wie ein Tipp in der Personenansicht – mit Rabatt, Preis und Kosten von jetzt
  function completeOrder(id) {
    const order = state.orders.find(o => o.id === id);
    if (!order) return;
    const p = personById(order.personId);
    const c = coffeeById(order.coffeeId);
    if (!p || !c) {
      toast('Person oder Sorte gibt es nicht mehr – bitte stornieren.', { error: true });
      return;
    }
    const entry = bookingFor(p, c, Date.now());
    state.entries.push(entry);
    save([['update', orderRef(id), { status: 'fertig', fertigAm: serverTimestamp() }]]);
    vibrate();
    toast(`${c.name} für ${p.name} verbucht`, {
      undo: () => {
        state.entries = state.entries.filter(e => e.id !== entry.id);
        save([['update', orderRef(id), { status: 'offen', fertigAm: deleteField() }]]);
        refresh();
      },
    });
  }

  function cancelOrder(id) {
    const order = state.orders.find(o => o.id === id);
    if (!order) return;
    const p = personById(order.personId);
    const c = coffeeById(order.coffeeId);
    commit([['delete', orderRef(id)]]);
    toast(`Storniert${p && c ? `: ${c.name} für ${p.name}` : ''}`, {
      undo: () => commit([['set', orderRef(id), restorable(order)]]),
    });
  }

  async function completeAll() {
    const valid = o => personById(o.personId) && coffeeById(o.coffeeId);
    const orders = state.orders.filter(valid);
    if (!orders.length) return;
    const persons = new Set(orders.map(o => o.personId)).size;
    const total = orders.reduce((sum, o) => sum + discountedPrice(coffeeById(o.coffeeId).price, personById(o.personId).discount), 0);
    const ok = await confirmDialog({
      title: 'Alle Bestellungen verbuchen?',
      html: `<strong>${plural(orders.length, 'Getränk', 'Getränke')}</strong> für ${plural(persons, 'Person', 'Personen')} werden angerechnet, zusammen <strong>${euro(total)}</strong>.<br><br>${orderSummary(orders)}`,
      confirmText: 'Alle verbuchen',
    });
    if (!ok) return;
    const done = state.orders.filter(valid);
    const now = Date.now();
    const entries = done.map(o => bookingFor(personById(o.personId), coffeeById(o.coffeeId), now));
    state.entries.push(...entries);
    save(done.map(o => ['update', orderRef(o.id), { status: 'fertig', fertigAm: serverTimestamp() }]));
    toast(`${plural(entries.length, 'Getränk', 'Getränke')} verbucht`, {
      undo: () => {
        const entryIds = new Set(entries.map(e => e.id));
        state.entries = state.entries.filter(e => !entryIds.has(e.id));
        save(done.map(o => ['update', orderRef(o.id), { status: 'offen', fertigAm: deleteField() }]));
        refresh();
      },
    });
  }

  // Gleiche Getränke hintereinander; die Sorte der frühesten Bestellung kommt zuerst
  function sortOrdersByDrink() {
    const before = state.orders.slice();
    const first = new Map();
    before.forEach((o, i) => { if (!first.has(o.coffeeId)) first.set(o.coffeeId, i); });
    const sorted = before
      .map((o, i) => ({ o, i }))
      .sort((a, b) => first.get(a.o.coffeeId) - first.get(b.o.coffeeId) || a.i - b.i)
      .map(x => x.o);
    if (sorted.every((o, i) => o === before[i])) {
      toast('Gleiche Getränke stehen schon hintereinander.');
      return;
    }
    reposition(sorted);
    toast('Nach Getränk sortiert', {
      undo: () => {
        const pos = new Map(before.map((o, i) => [o.id, i]));
        const at = o => (pos.has(o.id) ? pos.get(o.id) : 1e9 + orderKey(o));
        reposition(state.orders.slice().sort((a, b) => at(a) - at(b)));
      },
    });
  }

  // Ziehen am Griff (Maus, Finger, Stift): Eintrag folgt dem Zeiger, die anderen rücken nach
  let drag = null;

  function startDrag(e, handle) {
    const item = handle.closest('.q-item');
    const list = item.parentElement;
    e.preventDefault();
    try { handle.setPointerCapture(e.pointerId); } catch (err) { /* ignorieren */ }
    drag = { item, list, pointerId: e.pointerId, y: e.clientY, offsetY: e.clientY - item.getBoundingClientRect().top };
    item.classList.add('dragging');
    document.body.classList.add('drag-active');
    requestAnimationFrame(autoScroll);
  }

  function positionDrag() {
    const { item, list } = drag;
    const listTop = list.getBoundingClientRect().top;
    const top = drag.y - drag.offsetY;
    const center = top + item.offsetHeight / 2;
    const middle = el => listTop + el.offsetTop + el.offsetHeight / 2;
    let moved = false;
    let sibling;
    while ((sibling = item.previousElementSibling) && center < middle(sibling)) { list.insertBefore(item, sibling); moved = true; }
    while ((sibling = item.nextElementSibling) && center > middle(sibling)) { list.insertBefore(sibling, item); moved = true; }
    item.style.transform = `translateY(${top - (listTop + item.offsetTop)}px)`;
    if (moved) list.querySelectorAll('.q-num').forEach((num, i) => { num.textContent = `${i + 1}.`; });
  }

  function autoScroll() {
    if (!drag) return;
    const topEdge = 100;
    const bottomEdge = window.innerHeight - 150; // Navigationsleiste freihalten
    let dy = 0;
    if (drag.y < topEdge) dy = -Math.ceil((topEdge - drag.y) / 5);
    else if (drag.y > bottomEdge) dy = Math.ceil((drag.y - bottomEdge) / 5);
    if (dy) {
      window.scrollBy(0, dy);
      positionDrag();
    }
    requestAnimationFrame(autoScroll);
  }

  function endDrag() {
    const { item, list } = drag;
    drag = null;
    item.style.transform = '';
    item.classList.remove('dragging');
    document.body.classList.remove('drag-active');
    const ids = [...list.children].map(li => li.dataset.id);
    const byId = new Map(state.orders.map(o => [o.id, o]));
    const next = ids.map(id => byId.get(id)).filter(Boolean)
      .concat(state.orders.filter(o => !ids.includes(o.id)));
    const changed = next.some((o, i) => o !== state.orders[i]);
    if (changed) {
      pendingFocus = { id: item.dataset.id, action: null };
      reposition(next);
    }
    if (!changed || ordersDirty) {
      ordersDirty = false;
      render();
    }
  }

  function exportData() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    const data = {
      app: 'Kaffeekasse', exportiertAm: now.toISOString(), ...stammOf(state), entries: state.entries,
      orders: state.orders.map(o => ({ id: o.id, personId: o.personId, coffeeId: o.coffeeId, createdAt: o.erstellt })),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `kaffeekasse-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    try { localStorage.setItem(LAST_EXPORT_KEY, String(now.getTime())); } catch (e) { /* ignorieren */ }
    if (currentView === 'settings') render();
    toast('Backup-Datei wird gespeichert');
  }

  async function readBackupFile(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return null;
    let data = null;
    try { data = normalize(JSON.parse(await file.text())); } catch (e) { data = null; }
    if (!data) toast('Diese Datei ist kein gültiges Kaffeekasse-Backup.', { error: true });
    return data;
  }

  const backupSummary = data => `<strong>${data.people.length} Kollegen</strong>, <strong>${data.coffees.length} Kaffeesorten</strong>, ` +
    `<strong>${bookingsText(data.entries.length)}</strong>, <strong>${plural(data.beans.length, 'Bohne', 'Bohnen')}</strong>, ` +
    `<strong>${plural(data.groups.length, 'Gruppe', 'Gruppen')}</strong> und <strong>${plural(data.orders.length, 'offene Bestellung', 'offene Bestellungen')}</strong>`;

  async function importData(input) {
    const data = await readBackupFile(input);
    if (!data) return;
    const ok = await confirmDialog({
      title: 'Backup importieren?',
      html: `Das Backup enthält ${backupSummary(data)}.<br><br>Alle aktuellen Daten werden dadurch ersetzt.`,
      confirmText: 'Importieren',
      danger: true,
    });
    if (!ok) return;
    const replaced = state.orders.map(o => ['delete', orderRef(o.id)]);
    data.settings.teamCode = state.settings.teamCode; // der Team-Code bleibt
    state = { ...data, orders: state.orders };
    save(replaced.concat(importedOrderWrites(data.orders)));
    render();
    toast('Backup importiert');
  }

  // Bestellungen aus einem Backup wieder in die Warteschlange stellen
  function importedOrderWrites(orders) {
    return orders
      .filter(o => personById(o.personId) && coffeeById(o.coffeeId))
      .map((o, i) => ['set', doc(orderCollection(), o.id), {
        personId: o.personId, sorteId: o.coffeeId, pauseId: null, datum: todayKey(), uid: adminUser.uid,
        status: 'offen', quelle: 'admin', erstellt: serverTimestamp(), pos: i,
      }]);
  }

  // ---------- Anmeldung, Laden, erster Start ----------
  const gate = $('#gate');
  let unsubscribers = [];
  let loadingHint = 0;

  function showGate(html) {
    document.body.classList.add('gated');
    gate.hidden = false;
    gate.innerHTML = `<div class="gate-card"><div class="gate-logo">${ICON.cupBig}</div>${html}</div>`;
    window.scrollTo(0, 0);
  }

  function showApp() {
    clearTimeout(loadingHint);
    gate.hidden = true;
    gate.innerHTML = '';
    document.body.classList.remove('gated');
    lastHash = null;
    onRoute();
  }

  function stopSync() {
    unsubscribers.forEach(stop => stop());
    unsubscribers = [];
    if (ordersUnsub) ordersUnsub();
    ordersUnsub = null;
    ready = false;
    synced.stamm = null;
    synced.buckets = new Map();
  }

  function startAuth() {
    showGate('<p class="gate-text">Kaffeekasse wird geladen …</p>');
    getRedirectResult(auth).catch(loginFailed);
    onAuthStateChanged(auth, user => {
      stopSync();
      adminUser = user && !user.isAnonymous ? user : null;
      if (adminUser) startSync();
      else showLogin();
    });
  }

  function showLogin(message = '') {
    showGate(`
      <h1>Kaffeekasse</h1>
      <p class="gate-text">Melde dich mit deinem Google-Konto an, um deine Kaffeekasse zu öffnen.</p>
      <button class="btn primary block" data-gate="login">${ICON.login}Mit Google anmelden</button>
      ${message ? `<p class="gate-error">${esc(message)}</p>` : ''}`);
  }

  async function signIn() {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
        signInWithRedirect(auth, provider).catch(loginFailed);
      } else if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
        loginFailed(err);
      }
    }
  }

  function loginFailed(err) {
    console.error(err);
    const messages = {
      'auth/unauthorized-domain': 'Diese Adresse ist in Firebase nicht freigegeben (Authentication → Einstellungen → Autorisierte Domains).',
      'auth/network-request-failed': 'Keine Internetverbindung.',
    };
    showLogin(messages[err.code] || `Anmeldung fehlgeschlagen (${err.code || err.message}).`);
  }

  function startSync() {
    showGate('<p class="gate-text">Daten werden geladen …</p>');
    loadingHint = setTimeout(() => {
      if (!ready && !gate.hidden && gate.querySelector('[data-gate]') === null) {
        showGate('<p class="gate-text">Daten werden geladen …</p><p class="gate-text">Keine Verbindung? Beim allerersten Öffnen auf einem Gerät braucht die Kaffeekasse Internet.</p><button class="btn block" data-gate="reload">Erneut versuchen</button>');
      }
    }, 10000);
    let stammSnap = null;
    let bucketsLoaded = false;
    const proceed = () => {
      if (ready || !stammSnap || !bucketsLoaded) return;
      if (stammSnap.exists()) begin(stammSnap.get('daten'));
      else if (!stammSnap.metadata.fromCache) showWelcome(); // fehlt sie nur im Cache, sind wir offline
    };
    unsubscribers.push(onSnapshot(stammRef(), snap => {
      if (ready) remoteStamm(snap);
      else { stammSnap = snap; proceed(); }
    }, syncFailed));
    unsubscribers.push(onSnapshot(collection(db, 'buchungen'), snap => {
      let changed = false;
      for (const change of snap.docChanges()) {
        if (change.type === 'removed') {
          changed = synced.buckets.delete(change.doc.id) || changed;
          continue;
        }
        const json = change.doc.get('daten');
        if (synced.buckets.get(change.doc.id) !== json) {
          synced.buckets.set(change.doc.id, json);
          changed = true;
        }
      }
      if (!ready) {
        bucketsLoaded = true;
        proceed();
      } else if (changed) {
        state.entries = normalize({ ...stammOf(state), entries: entriesFromBuckets() }, true).entries;
        refresh();
      }
    }, syncFailed));
  }

  function syncFailed(err) {
    if (err.code === 'permission-denied') console.info('Kein Zugriff auf die Daten (noch nicht freigeschaltet)');
    else console.error(err);
    stopSync();
    if (err.code === 'permission-denied') showNotAdmin();
    else showGate(`<p class="gate-error">Die Daten konnten nicht geladen werden (${esc(err.code || err.message)}).</p><button class="btn primary block" data-gate="reload">Erneut versuchen</button>`);
  }

  function showNotAdmin() {
    showGate(`
      <h1>Noch nicht freigeschaltet</h1>
      <p class="gate-text">Angemeldet als <strong>${esc(adminUser.email || adminUser.displayName || 'Google-Konto')}</strong>. Dieses Konto ist in den Firestore-Regeln noch nicht als Inhaber eingetragen.</p>
      <div class="uid-box">
        <span class="uid-lbl">Deine Benutzer-ID</span>
        <code id="uidText">${esc(adminUser.uid)}</code>
        <button class="btn small" data-gate="copy-uid">${ICON.copy}Kopieren</button>
      </div>
      <ol class="gate-steps">
        <li>Firebase-Konsole öffnen → <strong>Firestore Database</strong> → Reiter <strong>Regeln</strong></li>
        <li><code>HIER-DEINE-BENUTZER-ID</code> durch deine Benutzer-ID ersetzen (die Anführungszeichen bleiben)</li>
        <li><strong>Veröffentlichen</strong> tippen und eine Minute warten</li>
      </ol>
      <button class="btn primary block" data-gate="reload">Erneut prüfen</button>
      <button class="btn ghost block" data-gate="logout">Mit anderem Konto anmelden</button>`);
  }

  function legacyData() {
    try { return normalize(JSON.parse(localStorage.getItem(LEGACY_KEY))); } catch (e) { return null; }
  }

  function showWelcome() {
    clearTimeout(loadingHint);
    const legacy = legacyData();
    showGate(`
      <h1>Willkommen!</h1>
      <p class="gate-text">Deine Kaffeekasse in der Cloud ist noch leer. So übernimmst du deine bisherigen Daten:</p>
      <ol class="gate-steps">
        <li>In der <strong>bisherigen</strong> App: <strong>Einstellungen → Datensicherung → Backup exportieren</strong></li>
        <li>Hier <strong>Backup importieren</strong> tippen und die Datei <code>kaffeekasse-backup-….json</code> auswählen</li>
      </ol>
      <button class="btn primary block" data-gate="import">${ICON.upload}Backup importieren</button>
      <input type="file" id="gateFile" accept=".json,application/json" hidden>
      ${legacy ? `<button class="btn block" data-gate="legacy">Daten aus diesem Browser übernehmen (${legacy.people.length} Kollegen, ${bookingsText(legacy.entries.length)})</button>` : ''}
      <button class="btn ghost block" data-gate="fresh">Ohne alte Daten neu beginnen</button>`);
  }

  // Erster Start: Daten (oder leere Kasse) in die Cloud schreiben
  function firstStart(data) {
    const start = data || defaultState();
    if (!start.settings.teamCode) start.settings.teamCode = newTeamCode();
    state = { ...start, orders: [] };
    ready = true;
    save([['set', teamRef(state.settings.teamCode), { erstellt: serverTimestamp() }], ...importedOrderWrites(start.orders)]);
    startOrders();
    showApp();
  }

  function begin(daten) {
    let loaded = null;
    try { loaded = normalize({ ...JSON.parse(daten), entries: entriesFromBuckets() }, true); } catch (e) { loaded = null; }
    if (!loaded) {
      showGate('<p class="gate-error">Die gespeicherten Daten sind nicht lesbar. Bitte ein Backup importieren.</p><button class="btn block" data-gate="reload">Erneut versuchen</button>');
      return;
    }
    synced.stamm = daten;
    state = { ...loaded, orders: [] };
    ready = true;
    const extra = [];
    if (!state.settings.teamCode) {
      state.settings.teamCode = newTeamCode();
      extra.push(['set', teamRef(state.settings.teamCode), { erstellt: serverTimestamp() }]);
    }
    save(extra); // schreibt nur, falls die Prüfung beim Laden etwas angepasst hat
    startOrders();
    showApp();
  }

  // Änderung von einem anderen Gerät
  function remoteStamm(snap) {
    if (!snap.exists()) return;
    const daten = snap.get('daten');
    if (daten === synced.stamm) return;
    let loaded = null;
    try { loaded = normalize({ ...JSON.parse(daten), entries: state.entries }, true); } catch (e) { loaded = null; }
    if (!loaded) return;
    synced.stamm = daten;
    const codeChanged = loaded.settings.teamCode !== state.settings.teamCode;
    Object.assign(state, {
      people: loaded.people, groups: loaded.groups, coffees: loaded.coffees,
      beans: loaded.beans, pauses: loaded.pauses, settings: loaded.settings,
    });
    if (codeChanged) startOrders();
    refresh();
  }

  async function copyText(value, message) {
    try {
      await navigator.clipboard.writeText(value);
      toast(message);
    } catch (e) {
      toast('Kopieren nicht möglich – bitte von Hand markieren.', { error: true });
    }
  }

  gate.addEventListener('click', async e => {
    const el = e.target.closest('[data-gate]');
    if (!el) return;
    switch (el.dataset.gate) {
      case 'login': signIn(); break;
      case 'logout': await signOut(auth); location.reload(); break;
      case 'reload': location.reload(); break;
      case 'copy-uid': copyText(adminUser.uid, 'Benutzer-ID kopiert'); break;
      case 'import': $('#gateFile').click(); break;
      case 'legacy': {
        const data = legacyData();
        if (data && await confirmDialog({ title: 'Daten übernehmen?', html: `Übernommen werden ${backupSummary(data)}.`, confirmText: 'Übernehmen' })) firstStart(data);
        break;
      }
      case 'fresh':
        if (await confirmDialog({
          title: 'Ohne alte Daten beginnen?',
          html: 'Die Kaffeekasse startet leer mit den Beispielsorten. Ein Backup kannst du später jederzeit unter Einstellungen importieren – dabei werden dann alle Daten ersetzt.',
          confirmText: 'Leer beginnen',
        })) firstStart(null);
        break;
    }
  });

  gate.addEventListener('change', async e => {
    if (e.target.id !== 'gateFile') return;
    const data = await readBackupFile(e.target);
    if (data && await confirmDialog({
      title: 'Backup übernehmen?',
      html: `Das Backup enthält ${backupSummary(data)}.`,
      confirmText: 'Übernehmen',
    })) firstStart(data);
  });

  function updateNetBanner() {
    const warn = $('#warn');
    warn.textContent = 'Offline – deine Änderungen werden gespeichert und übertragen, sobald wieder Internet da ist.';
    warn.hidden = navigator.onLine;
  }
  window.addEventListener('online', updateNetBanner);
  window.addEventListener('offline', updateNetBanner);

  // ---------- Ereignisse ----------
  tabbar.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    e.preventDefault();
    const href = tab.getAttribute('href');
    if (location.hash === href || (href === '#/' && !location.hash)) window.scrollTo({ top: 0, behavior: 'smooth' });
    else go(href);
  });

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const id = el.dataset.id;
    switch (el.dataset.action) {
      case 'open': go('#/p/' + encodeURIComponent(id)); break;
      case 'person-settings': go(`#/p/${encodeURIComponent(id)}/einstellungen`); break;
      case 'goto-settings': e.preventDefault(); go('#/einstellungen'); break;
      case 'settings-add':
        go('#/einstellungen');
        setTimeout(() => { const i = $('#newPerson'); if (i) i.focus(); }, 50);
        break;
      case 'back': goBack(el.dataset.fallback); break;
      case 'book': book(id, el); break;
      case 'fill-pay': {
        const input = $('#payInput');
        input.value = plain(Math.max(0, balanceOf(currentId)));
        input.classList.remove('invalid');
        input.focus();
        break;
      }
      case 'del-entry': deleteEntry(id); break;
      case 'del-person': deletePerson(id); break;
      case 'del-coffee': deleteCoffee(id); break;
      case 'new-bean': go('#/bohnen/neu'); break;
      case 'edit-bean': go('#/bohnen/' + encodeURIComponent(id)); break;
      case 'activate-bean': activateBean(id); break;
      case 'del-bean': deleteBean(id); break;
      case 'period':
        statsPeriod = id;
        try { localStorage.setItem(PERIOD_KEY, id); } catch (err) { /* ignorieren */ }
        render();
        break;
      case 'toggle-group': toggleGroup(id, el); break;
      case 'expand-all': setAllGroups(false); break;
      case 'collapse-all': setAllGroups(true); break;
      case 'del-group': deleteGroup(id); break;
      case 'new-order': go('#/bestellungen/neu'); break;
      case 'pick-person': replaceRoute('#/bestellungen/neu/' + encodeURIComponent(id)); break;
      case 'pick-back': replaceRoute('#/bestellungen/neu'); break;
      case 'choose-coffee': pick.coffeeId = id; updatePickUi(); break;
      case 'qty': pick.qty = Math.min(MAX_QTY, Math.max(1, pick.qty + Number(id))); updatePickUi(); break;
      case 'place-order': placeOrder(false); break;
      case 'place-order-more': placeOrder(true); break;
      case 'order-up': moveOrder(id, -1); break;
      case 'order-down': moveOrder(id, 1); break;
      case 'order-done': completeOrder(id); break;
      case 'order-cancel': cancelOrder(id); break;
      case 'all-done': completeAll(); break;
      case 'sort-orders': sortOrdersByDrink(); break;
      case 'logout': signOut(auth).then(() => location.reload()); break;
      case 'export': exportData(); break;
      case 'import': $('#importFile').click(); break;
    }
  });

  app.addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target.dataset.form;
    if (form === 'pay') submitPayment();
    else if (form === 'add-person') addPerson();
    else if (form === 'add-coffee') addCoffee();
    else if (form === 'person-settings') savePersonSettings();
    else if (form === 'bean') saveBean();
    else if (form === 'add-group') addGroup();
  });

  app.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'importFile') importData(t);
    else if (t.id === 'sortSel') {
      sortMode = t.value;
      savePref(SORT_KEY, sortMode);
      render();
    } else if (t.dataset.edit) onEdit(t);
  });

  app.addEventListener('input', e => {
    const t = e.target;
    t.classList.remove('invalid');
    if (t.id === 'search') {
      const q = t.value.trim().toLocaleLowerCase('de');
      const root = $('#peopleList');
      root.classList.toggle('searching', q !== ''); // eingeklappte Gruppen beim Suchen zeigen
      let shown = 0;
      root.querySelectorAll('li[data-name]').forEach(li => {
        const match = li.dataset.name.includes(q);
        li.hidden = !match;
        if (match) shown++;
      });
      root.querySelectorAll('.grp, .pick-sec').forEach(sec => {
        sec.hidden = q !== '' && !sec.querySelector('li[data-name]:not([hidden])');
      });
      $('#noMatch').hidden = shown > 0;
    } else if (t.id === 'psDiscount') {
      $('#discountPreview').innerHTML = discountPreviewHtml(parsePercent(t.value));
    }
  });

  app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.edit) {
      e.preventDefault();
      e.target.blur();
    }
  });

  app.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.q-handle');
    if (handle && !drag && e.button === 0) startDrag(e, handle);
  });
  app.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.y = e.clientY;
    positionDrag();
  });
  const stopDrag = e => { if (drag && e.pointerId === drag.pointerId) endDrag(); };
  app.addEventListener('pointerup', stopDrag);
  app.addEventListener('pointercancel', stopDrag);

  updateNetBanner();
  startAuth();
})();
</script>
</body>
</html>
