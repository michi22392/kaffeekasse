<style>
  :root {
    color-scheme: light dark;
    --bg: #f6efe7;
    --surface: #fffaf4;
    --surface-2: #f1e6d9;
    --text: #2a1c13;
    --muted: #7b6555;
    --border: #e7d9c9;
    --primary: #6b4428;
    --primary-press: #55351e;
    --on-primary: #fff8f0;
    --accent: #c8894e;
    --danger: #b0391f;
    --danger-bg: #fbe5dd;
    --done: #2c7543;
    --done-bg: #e0f0e4;
    --toast-bg: #2a1c13;
    --toast-fg: #fff8f0;
    --shadow: 0 1px 2px rgba(70, 40, 20, .06), 0 6px 18px rgba(70, 40, 20, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17110d;
      --surface: #221912;
      --surface-2: #2e2219;
      --text: #f5ebe0;
      --muted: #b9a390;
      --border: #3a2b20;
      --primary: #c8915a;
      --primary-press: #b47f4b;
      --on-primary: #1c120b;
      --accent: #e3a96b;
      --danger: #ff8c72;
      --danger-bg: #3d1e15;
      --done: #7fd497;
      --done-bg: #163020;
      --toast-bg: #f5ebe0;
      --toast-fg: #1c120b;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg { flex: none; }
  [hidden] { display: none !important; }

  .bar { display: flex; align-items: center; min-height: 64px; padding-top: env(safe-area-inset-top); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.35rem; font-weight: 800; }
  .brand-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--on-primary); }

  .card { margin: 0 0 14px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.05rem; }
  .step { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: .85rem; font-weight: 800; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .choice {
    min-height: 72px; padding: 10px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 2px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text);
    font-size: 1.05rem; font-weight: 700; line-height: 1.2; text-align: center; overflow-wrap: anywhere;
  }
  .choice-sub { font-size: .9rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .choice[aria-checked="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .choice[aria-checked="true"] .choice-sub { color: inherit; opacity: .9; }
  .choice:active { transform: scale(.97); }

  .me { display: flex; align-items: center; gap: 12px; }
  .me strong { flex: 1; min-width: 0; font-size: 1.2rem; overflow-wrap: anywhere; }
  .avatar { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; }
  #search { width: 100%; min-height: 48px; margin-bottom: 10px; padding: 0 14px; font-size: 17px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 18px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 700;
  }
  .btn.small { min-height: 40px; padding: 0 12px; font-size: .92rem; }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn.primary:active { background: var(--primary-press); }
  .btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.block { width: 100%; }
  .btn.big { min-height: 60px; font-size: 1.1rem; border-radius: 16px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .order-bar { position: sticky; bottom: 0; z-index: 5; margin: 0 -16px 14px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); }

  .success { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 14px 16px; border-radius: var(--radius); background: var(--done-bg); color: var(--done); font-weight: 800; font-size: 1.05rem; }
  .notice { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--muted); }
  .empty { margin: 0; color: var(--muted); }

  .mine { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .mine-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .mine-row:first-child { border-top: 0; }
  .mine-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mine-sub { font-size: .88rem; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 99px; font-size: .8rem; font-weight: 800; }
  .status.offen { background: var(--surface-2); color: var(--primary); }
  .status.fertig { background: var(--done-bg); color: var(--done); }

  .foot { text-align: center; margin: 18px 0 0; }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 10px; }

  .center { min-height: 80vh; display: grid; align-content: center; justify-items: center; gap: 4px; text-align: center; }
  .logo { display: grid; place-items: center; width: 84px; height: 84px; margin-bottom: 12px; border-radius: 24px; background: var(--primary); color: var(--on-primary); }
  .center h1 { margin: 0 0 6px; font-size: 1.6rem; }
  .lead { margin: 0 0 18px; color: var(--muted); max-width: 360px; }
  .code-form { display: grid; gap: 10px; width: 100%; max-width: 360px; }
  #codeInput { min-height: 56px; padding: 0 14px; font-size: 1.4rem; font-weight: 800; letter-spacing: .08em; text-align: center; text-transform: uppercase; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .error { margin: 14px 0 0; color: var(--danger); font-weight: 700; max-width: 360px; }

  .toast {
    position: fixed; z-index: 50; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100vw - 32px);
    padding: 12px 16px; border-radius: 14px; background: var(--toast-bg); color: var(--toast-fg);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25); font-weight: 600;
    opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); color: #fff; }

  dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 20px; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
  dialog::backdrop { background: rgba(30, 18, 10, .5); }
  dialog form { padding: 20px; }
  dialog h2 { margin: 0 0 8px; font-size: 1.2rem; }
  dialog p { margin: 0; color: var(--muted); }
  dialog p strong { color: var(--text); }
  .dlg-actions { display: flex; gap: 10px; margin-top: 20px; }
  .dlg-actions .btn { flex: 1; }
  .hello { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .hello .avatar { width: 48px; height: 48px; font-size: 1.05rem; }
  .hello-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hello-text strong { font-size: 1.3rem; line-height: 1.25; overflow-wrap: anywhere; }
  .saldo { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .saldo.debt { color: var(--danger); }
  .saldo.credit, .saldo.zero { color: var(--done); }
  .again { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
  .again-lbl { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 700; color: var(--muted); }
  .chip { min-height: 40px; padding: 0 14px; border: 2px solid var(--border); border-radius: 99px; background: var(--surface-2); color: var(--text); font-weight: 700; }
  .chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
  .fav { display: inline-flex; align-items: center; gap: 3px; margin-top: 2px; font-size: .75rem; font-weight: 700; color: var(--accent); }
  .choice[aria-checked="true"] .fav { color: inherit; }
  .small-note { margin: 14px 0 0; font-size: .92rem; color: var(--muted); max-width: 360px; }
  .small-note + .btn { margin-top: 18px; }
  .seats { margin-top: 3px; font-size: .8rem; font-weight: 800; color: var(--done); }
  .seats.few { color: var(--accent); }
  .choice.full { background: var(--surface-2); border-style: dashed; color: var(--muted); cursor: not-allowed; }
  .choice.full .seats { color: var(--danger); }
  .choice:disabled { opacity: .6; }
  .choice:disabled:active { transform: none; }
  .choice[aria-checked="true"] .seats { color: inherit; }
  .notice.warn { margin-top: 12px; background: var(--danger-bg); color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgMsg"></p>
    <div class="dlg-actions">
      <button class="btn" value="cancel">Abbrechen</button>
      <button class="btn primary" value="ok" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<script type="module">
import { firebaseConfig, useEmulator } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, connectAuthEmulator, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {
  getFirestore, connectFirestoreEmulator, collection, doc, getDoc, getDocs, setDoc, query, where, onSnapshot, serverTimestamp, runTransaction,
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
if (useEmulator) {
  connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectFirestoreEmulator(db, '127.0.0.1', 8080);
}

// Bestellseite für Kollegen, anonyme Anmeldung. Zwei Zugänge:
//  - persönlicher Link (…/bestellen.html?k=SCHLÜSSEL): nur die eigene Person, eigene Bestellungen,
//    Lieblingsgetränk und – falls freigegeben – der eigene Saldo
//  - allgemeine Seite mit Team-Code (…#code=…), solange sie in der Kaffeekasse aktiv ist
// Gelesen werden nur Namen, Sorten mit normalem Preis, Pausen und wie viele Plätze je Pause noch frei
// sind – keine privaten Daten. Jede Bestellung belegt per Transaktion einen Platz im Zähler der Pause.
(function () {
  'use strict';

  const CODE_KEY = 'bestellen.teamCode';
  const PERSON_KEY = 'bestellen.person';
  const LINK_KEY = 'bestellen.schluessel';
  const SESSION_KEY = 'bestellen.sitzung';
  const RELOAD_AFTER = 5 * 60 * 1000; // Daten nach 5 Minuten im Hintergrund neu laden
  const KEY_FORMAT = /^[A-Za-z0-9]{24,64}$/;

  const $ = sel => document.querySelector(sel);
  const app = $('#app');
  const euroFmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  const euro = cents => euroFmt.format(cents / 100);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clock = time => time.replace(/^0(\d)/, '$1');
  const pad = n => String(n).padStart(2, '0');
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const initials = name => name.split(' ').filter(Boolean).map(w => Array.from(w)[0]).slice(0, 2).join('').toLocaleUpperCase('de');
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value); } catch (e) { /* ignorieren */ } },
  };

  const svg = (body, size = 22) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const CUP = '<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/>';
  const ICON = {
    cup: svg(CUP),
    cupBig: svg(CUP, 40),
    check: svg('<path d="M20 6 9 17l-5-5"/>', 20),
    checkSmall: svg('<path d="M20 6 9 17l-5-5"/>', 14),
    alert: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>', 20),
    star: svg('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/>', 12),
    again: svg('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', 16),
  };

  let mode = null;      // 'link' (persönlicher Link) oder 'team' (allgemeine Seite)
  let key = null;       // persönlicher Schlüssel
  let code = null;      // Team-Code
  let uid = null;       // anonyme Kennung dieses Geräts (bzw. dieser Home-Bildschirm-App)
  let team = null;      // { people, coffees, pauses }
  let me = null;        // persönlicher Link: { personId, name, saldo, fav, zuletzt }
  let mine = [];        // eigene Bestellungen von heute
  let mineUnsub = null;
  let linkUnsub = null;
  let countsUnsub = null;
  let pausesUnsub = null;
  let counts = new Map(); // Pause → heute schon bestellte Getränke
  let fullNotice = '';    // Hinweis, wenn eine Pause beim Bestellen voll wurde
  let loadedAt = 0;
  let day = dateKey(new Date());
  let sending = false;
  let success = '';
  // pauseAuto: Pause automatisch wählen (nächste mit freien Plätzen), bis selbst eine gewählt wird
  const sel = { personId: null, coffeeId: null, pauseId: null, pauseAuto: true, changingPerson: false };

  // ---------- Meldungen ----------
  const toastEl = $('#toast');
  let toastTimer = 0;
  function toast(msg, opts = {}) {
    clearTimeout(toastTimer);
    toastEl.className = 'toast' + (opts.error ? ' error' : '');
    toastEl.innerHTML = `${opts.error ? ICON.alert : ICON.check}<span>${esc(msg)}</span>`;
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  const dlg = $('#dlg');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close('cancel'); });
  function confirmDialog({ title, html, confirmText = 'OK', danger = false }) {
    if (typeof dlg.showModal !== 'function') return Promise.resolve(window.confirm(title));
    $('#dlgTitle').textContent = title;
    $('#dlgMsg').innerHTML = html;
    const ok = $('#dlgOk');
    ok.textContent = confirmText;
    ok.className = 'btn ' + (danger ? 'danger' : 'primary');
    dlg.returnValue = '';
    dlg.showModal();
    return new Promise(resolve => dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok'), { once: true }));
  }

  function stopListening() {
    if (mineUnsub) { mineUnsub(); mineUnsub = null; }
    if (linkUnsub) { linkUnsub(); linkUnsub = null; }
    if (countsUnsub) { countsUnsub(); countsUnsub = null; }
    if (pausesUnsub) { pausesUnsub(); pausesUnsub = null; }
  }

  function showScreen({ text, note = '', retry = false, id = '' }) {
    app.innerHTML = `
      <div class="center"${id ? ` id="${id}"` : ''}>
        <div class="logo">${ICON.cupBig}</div>
        <h1>Kaffee bestellen</h1>
        <p class="lead">${esc(text)}</p>
        ${note ? `<p class="small-note">${esc(note)}</p>` : ''}
        ${retry ? '<button class="btn primary" data-act="reload">Erneut versuchen</button>' : ''}
      </div>`;
  }

  const showMessage = (text, retry = false) => showScreen({ text, retry });

  function showInvalid() {
    stopListening();
    team = null;
    mode = null;
    showScreen({
      id: 'invalid',
      text: 'Dieser Link ist nicht mehr gültig, bitte frag nach einem neuen.',
      note: 'Liegt die Seite auf deinem Home-Bildschirm? Dann lösche das alte Symbol und lege den neuen Link noch einmal dort ab.',
      retry: true,
    });
  }

  // Allgemeine Seite in der Kaffeekasse abgeschaltet: nur noch Hinweis auf den persönlichen Link
  function showLinkHint() {
    stopListening();
    team = null;
    mode = null;
    showScreen({
      id: 'needLink',
      text: 'Zum Bestellen brauchst du jetzt deinen persönlichen Link.',
      note: 'Du bekommst ihn von der Kaffeekasse – einfach öffnen, dann geht es direkt los.',
    });
  }

  // ---------- Start ----------
  function codeFromLink() {
    const match = location.hash.match(/code=([A-Za-z0-9-]+)/);
    if (!match) return null;
    history.replaceState(null, '', location.pathname + location.search); // Code nicht in der Adresszeile lassen
    return match[1].toUpperCase();
  }

  // Der Schlüssel bleibt in der Adresse (?k=…): Home-Bildschirm-Apps auf dem iPhone haben einen
  // eigenen Speicher und kennen nur die Adresse, mit der sie abgelegt wurden.
  function keepKeyInAddress(k) {
    const params = new URLSearchParams(location.search);
    params.set('k', k);
    const wanted = `${location.pathname}?${params}`;
    if (location.pathname + location.search + location.hash !== wanted) history.replaceState(null, '', wanted);
  }

  // Web-App-Manifest mit Start-Adresse inklusive Schlüssel (sonst würde der Startbildschirm ihn verlieren)
  function setManifest() {
    const start = new URL(location.pathname + location.search, location.origin).href;
    const icon = document.querySelector('link[rel="apple-touch-icon"]');
    const manifest = {
      id: start,
      name: 'Kaffee bestellen',
      short_name: 'Kaffee',
      start_url: start,
      scope: new URL('./', location.href).href,
      display: 'standalone',
      background_color: '#f6efe7',
      theme_color: '#6b4428',
      icons: icon ? [{ src: icon.href, sizes: '180x180', type: 'image/png' }] : [],
    };
    let link = document.querySelector('link[rel="manifest"]');
    if (!link) {
      link = document.createElement('link');
      link.rel = 'manifest';
      document.head.appendChild(link);
    }
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  }

  function signedIn() {
    return new Promise((resolve, reject) => {
      const stop = onAuthStateChanged(auth, user => {
        stop();
        if (user) resolve(user.uid);
        else signInAnonymously(auth).then(cred => resolve(cred.user.uid), reject);
      });
    });
  }

  async function start() {
    showMessage('Wird geladen …');
    const params = new URLSearchParams(location.search);
    const urlKey = params.get('k');
    const linked = codeFromLink();
    if (urlKey !== null) {
      if (!KEY_FORMAT.test(urlKey)) { showInvalid(); return; } // z. B. beim Kopieren abgeschnitten
      store.set(LINK_KEY, urlKey);
    }
    if (linked) store.set(CODE_KEY, linked);
    key = store.get(LINK_KEY);
    if (key && !KEY_FORMAT.test(key)) key = null;
    code = store.get(CODE_KEY);
    if (key) keepKeyInAddress(key);
    setManifest();
    try {
      uid = await signedIn();
    } catch (e) {
      showMessage('Keine Verbindung. Bitte prüfe die Internetverbindung.', true);
      return;
    }
    if (key) openLink(key); // der persönliche Link ersetzt den Team-Code
    else if (code) openTeam(code);
    else showStart();
  }

  const pausesFrom = snap => snap.docs
    .map(d => ({ id: d.id, time: d.get('zeit'), name: d.get('name') || '', limit: Number.isInteger(d.get('limit')) ? d.get('limit') : 0 }))
    .sort((a, b) => a.time.localeCompare(b.time));

  async function loadMenu(base) {
    const [coffees, pauses] = await Promise.all(['sorten', 'pausen'].map(name => getDocs(collection(db, ...base, name))));
    loadedAt = Date.now();
    return {
      coffees: coffees.docs.map(d => ({ id: d.id, name: d.get('name'), price: d.get('preis'), pos: d.get('pos') })).sort((a, b) => a.pos - b.pos),
      pauses: pausesFrom(pauses),
    };
  }

  const pauseBase = () => (mode === 'link' ? ['pausen'] : ['teams', code, 'pausen']);

  // Pausen (Uhrzeit, Limit) und Zähler live: "noch 3 von 8 frei" stimmt immer
  // Allgemeine Seite: Wird der Team-Bereich gelöscht (Code geändert oder Seite abgeschaltet),
  // verschwinden Pausen und Namen – dann den Code sofort neu prüfen
  const teamGone = snap => mode === 'team' && snap.empty && snap.docChanges().some(ch => ch.type === 'removed');

  function listenSeats() {
    if (pausesUnsub) pausesUnsub();
    if (countsUnsub) countsUnsub();
    const stops = [];
    stops.push(onSnapshot(collection(db, ...pauseBase()), snap => {
      if (!team) return;
      if (teamGone(snap)) { openTeam(code, true); return; }
      team.pauses = pausesFrom(snap);
      refreshSeats();
    }, err => { if (err.code === 'permission-denied') recover(); else console.info('Pausen', err.code); }));
    if (mode === 'team') {
      stops.push(onSnapshot(collection(db, 'teams', code, 'kollegen'), snap => {
        if (!team) return;
        if (teamGone(snap)) { openTeam(code, true); return; }
        team.people = snap.docs.map(d => ({ id: d.id, name: d.get('name') })).sort((x, y) => x.name.localeCompare(y.name, 'de', { sensitivity: 'base' }));
        refreshSeats();
      }, err => { if (err.code === 'permission-denied') recover(); else console.info('Kollegen', err.code); }));
    }
    pausesUnsub = () => stops.forEach(stop => stop());
    countsUnsub = onSnapshot(query(collection(db, 'zaehler'), where('datum', '==', dateKey(new Date()))), snap => {
      counts = new Map(snap.docs.map(d => [d.get('pauseId'), d.get('anzahl') || 0]));
      refreshSeats();
    }, err => {
      if (err.code === 'permission-denied') recover();
      else console.info('Zähler', err.code);
    });
  }

  function refreshSeats() {
    if (team && mode && !sending && !dlg.open) render();
  }

  // ---------- Persönlicher Link ----------
  // Dieses Gerät mit dem Schlüssel anmelden (die Regeln prüfen dabei, ob der Link gültig ist)
  // data: { schluessel } beim persönlichen Link, { team } bei der allgemeinen Seite
  let forceSession = false;
  async function ensureSession(data, force = false) {
    const mark = `${uid}|${JSON.stringify(data)}`;
    if (!force && !forceSession && store.get(SESSION_KEY) === mark) return;
    await setDoc(doc(db, 'sitzungen', uid), data);
    store.set(SESSION_KEY, mark);
    forceSession = false;
  }

  // Zugriff verweigert: Anmeldung des Geräts erneuern und neu laden (höchstens alle 10 Sekunden)
  let lastRecover = 0;
  function recover() {
    if (Date.now() - lastRecover < 10000) return;
    lastRecover = Date.now();
    forceSession = true;
    reopen();
  }

  async function loadLinkMenu(k) {
    try {
      await ensureSession({ schluessel: k });
      return await loadMenu([]);
    } catch (e) {
      if (e.code !== 'permission-denied') throw e;
      await ensureSession({ schluessel: k }, true); // Anmeldung erneuern (z. B. nach einem Wechsel des Links)
      return await loadMenu([]);
    }
  }

  async function openLink(k, quiet = false) {
    let snap, menu;
    try {
      snap = await getDoc(doc(db, 'links', k));
      if (!snap.exists()) { showInvalid(); return; }
      menu = await loadLinkMenu(k);
    } catch (e) {
      if (e.code === 'permission-denied') showInvalid();
      else if (!quiet) showMessage('Die Daten konnten nicht geladen werden. Bitte prüfe die Internetverbindung.', true);
      return;
    }
    mode = 'link';
    key = k;
    team = { ...menu, people: [] };
    applyLink(snap.data());
    if (!sel.coffeeId && me.fav) sel.coffeeId = me.fav; // Lieblingsgetränk vorauswählen
    listenLink();
    listenMine();
    listenSeats();
    render();
  }

  function applyLink(data) {
    me = {
      personId: data.personId,
      name: data.name || '',
      saldo: Number.isInteger(data.saldo) ? data.saldo : null,
      fav: team.coffees.some(c => c.id === data.fav) ? data.fav : null,
      zuletzt: Array.isArray(data.zuletzt) ? data.zuletzt.filter(id => team.coffees.some(c => c.id === id)) : [],
    };
    team.people = [{ id: me.personId, name: me.name }];
    sel.personId = me.personId;
  }

  // Name, Saldo und Lieblingsgetränk live; wird der Link ungültig, sofort Hinweis zeigen
  function listenLink() {
    if (linkUnsub) linkUnsub();
    linkUnsub = onSnapshot(doc(db, 'links', key), snap => {
      if (!snap.exists()) { showInvalid(); return; }
      if (mode !== 'link') return;
      applyLink(snap.data());
      if (!sending && !dlg.open) render();
    }, err => console.info('Link', err.code));
  }

  // ---------- Allgemeine Seite (Team-Code) ----------
  async function teamPageOff() {
    try {
      const snap = await getDoc(doc(db, 'oeffentlich', 'status'));
      return snap.exists() && snap.get('teamSeite') === false;
    } catch (e) {
      return false;
    }
  }

  async function showStart() {
    if (await teamPageOff()) showLinkHint();
    else showCodeForm();
  }

  async function loadTeam(teamCode) {
    const [people, menu] = await Promise.all([
      getDocs(collection(db, 'teams', teamCode, 'kollegen')),
      loadMenu(['teams', teamCode]),
    ]);
    return {
      ...menu,
      people: people.docs.map(d => ({ id: d.id, name: d.get('name') })).sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' })),
    };
  }

  async function openTeam(teamCode, quiet = false, loaded = null) {
    try {
      team = loaded || await loadTeam(teamCode);
      await ensureSession({ team: teamCode }); // Gerät mit dem Team-Code anmelden
    } catch (e) {
      team = null;
      if (e.code === 'permission-denied') {
        if (await teamPageOff()) showLinkHint();
        else showCodeForm('Der Team-Code ist nicht (mehr) gültig. Bitte den aktuellen Code eingeben oder den neuen Link bzw. QR-Code öffnen.');
      } else if (!quiet) {
        showMessage('Die Daten konnten nicht geladen werden. Bitte prüfe die Internetverbindung.', true);
      }
      return;
    }
    mode = 'team';
    code = teamCode;
    me = null;
    store.set(CODE_KEY, teamCode);
    if (!sel.personId) {
      const saved = store.get(PERSON_KEY);
      if (team.people.some(p => p.id === saved)) sel.personId = saved;
    }
    listenMine();
    listenSeats();
    render();
  }

  // Eigene Bestellungen von heute – live, damit "fertig" sofort erscheint.
  // Persönlicher Link: alle Bestellungen der Person (auch von anderen Geräten);
  // allgemeine Seite: die von diesem Gerät.
  function listenMine() {
    if (mineUnsub) mineUnsub();
    day = dateKey(new Date());
    const q = mode === 'link'
      ? query(collection(db, 'bestellungen'), where('personId', '==', me.personId), where('datum', '==', day))
      : query(collection(db, 'bestellungen'), where('uid', '==', uid), where('datum', '==', day));
    mineUnsub = onSnapshot(q, snap => {
      mine = snap.docs.map(d => {
        const x = d.data({ serverTimestamps: 'estimate' });
        return { id: d.id, personId: x.personId, coffeeId: x.sorteId, pauseId: x.pauseId, status: x.status, quelle: x.quelle, erstellt: x.erstellt ? x.erstellt.toMillis() : Date.now() };
      });
      const box = $('#mine');
      if (box) box.innerHTML = mineHtml();
    }, err => {
      if (err.code === 'permission-denied') recover();
      else console.error(err);
    });
  }

  function reopen(quiet = false) {
    if (mode === 'link') openLink(key, quiet);
    else if (mode === 'team') openTeam(code, quiet);
  }

  // ---------- Team-Code ----------
  function showCodeForm(message = '', value = '') {
    stopListening();
    team = null;
    mode = null;
    app.innerHTML = `
      <div class="center">
        <div class="logo">${ICON.cupBig}</div>
        <h1>Kaffee bestellen</h1>
        <p class="lead">Gib den Team-Code ein, den du von der Kaffeekasse bekommen hast. Das Gerät merkt sich den Code.</p>
        <form class="code-form" id="codeForm" novalidate>
          <input type="text" id="codeInput" value="${esc(value)}" placeholder="ABCD-EFGH" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Team-Code">
          <button class="btn primary block big" type="submit" id="codeBtn">Weiter</button>
        </form>
        ${message ? `<p class="error" role="alert">${esc(message)}</p>` : ''}
        <p class="small-note">Hast du einen persönlichen Link bekommen? Dann öffne einfach diesen – ganz ohne Code.</p>
      </div>`;
  }

  async function submitCode() {
    const input = $('#codeInput');
    const value = input.value.trim().toUpperCase().replace(/\s+/g, '-');
    if (!/^[A-Z0-9-]{4,40}$/.test(value)) {
      showCodeForm('Bitte den Code genau so eingeben, wie du ihn bekommen hast (Buchstaben, Ziffern, Bindestrich).', value);
      return;
    }
    $('#codeBtn').disabled = true;
    $('#codeBtn').textContent = 'Wird geprüft …';
    let loaded;
    try {
      loaded = await loadTeam(value);
    } catch (e) {
      if (e.code === 'permission-denied' && await teamPageOff()) showLinkHint();
      else showCodeForm(e.code === 'permission-denied' ? 'Dieser Code ist ungültig.' : 'Keine Verbindung. Bitte später erneut versuchen.', value);
      return;
    }
    await openTeam(value, false, loaded);
  }

  // ---------- Bestellen ----------
  const upcoming = () => team.pauses.filter(b => b.time > nowTime());
  const seatsLeft = b => (b.limit > 0 ? Math.max(0, b.limit - (counts.get(b.id) || 0)) : Infinity);
  const isFull = b => seatsLeft(b) === 0;
  const available = () => upcoming().filter(b => !isFull(b));
  const person = () => team.people.find(p => p.id === sel.personId);
  const coffee = () => team.coffees.find(c => c.id === sel.coffeeId);
  const pause = () => team.pauses.find(b => b.id === sel.pauseId);

  function orderButton() {
    const c = coffee(), b = pause();
    if (sending) return { label: 'Wird gesendet …', ready: false };
    if (!person()) return { label: 'Bitte zuerst auswählen, wer du bist', ready: false };
    if (!c) return { label: 'Bitte ein Getränk auswählen', ready: false };
    if (!b) {
      const label = !upcoming().length ? 'Heute keine Pause mehr' : available().length ? 'Bitte eine Pause auswählen' : 'Alle Pausen sind ausgebucht';
      return { label, ready: false };
    }
    return { label: `${c.name} für ${clock(b.time)} Uhr bestellen`, ready: true };
  }

  function personHtml() {
    const p = person();
    if (p && !sel.changingPerson) {
      return `<div class="me"><span class="avatar">${esc(initials(p.name))}</span><strong>${esc(p.name)}</strong><button class="btn small" data-act="change-person">Ändern</button></div>`;
    }
    if (!team.people.length) return '<p class="notice">Es sind noch keine Kollegen eingetragen.</p>';
    return `
      ${team.people.length > 12 ? '<input type="search" id="search" placeholder="Name suchen …" aria-label="Name suchen" autocomplete="off">' : ''}
      <div class="grid" role="radiogroup" aria-label="Wer bist du?">
        ${team.people.map(p => `<button type="button" class="choice" role="radio" aria-checked="${p.id === sel.personId}" data-pick="person" data-id="${p.id}" data-name="${esc(p.name.toLocaleLowerCase('de'))}">${esc(p.name)}</button>`).join('')}
      </div>`;
  }

  // Begrüßung mit Namen und – falls freigegeben – dem eigenen Saldo
  function helloHtml() {
    let balance = '';
    if (me.saldo !== null) {
      balance = me.saldo > 0 ? `<span class="saldo debt">Offen: ${euro(me.saldo)}</span>`
        : me.saldo < 0 ? `<span class="saldo credit">Guthaben: ${euro(-me.saldo)}</span>`
        : `<span class="saldo zero">${ICON.checkSmall} Alles bezahlt</span>`;
    }
    return `
      <section class="hello" id="hello">
        <span class="avatar">${esc(initials(me.name || '?'))}</span>
        <span class="hello-text"><strong>Hallo ${esc(me.name)}</strong>${balance}</span>
      </section>`;
  }

  function coffeesHtml() {
    const recent = mode === 'link' ? me.zuletzt : [];
    const fav = mode === 'link' ? me.fav : null;
    const chips = recent.length ? `
      <div class="again" role="group" aria-label="Nochmal bestellen">
        <span class="again-lbl">${ICON.again}Nochmal:</span>
        ${recent.map(id => {
          const c = team.coffees.find(x => x.id === id);
          return `<button type="button" class="chip" aria-pressed="${id === sel.coffeeId}" data-pick="coffee" data-id="${id}">${esc(c.name)}</button>`;
        }).join('')}
      </div>` : '';
    if (!team.coffees.length) return '<p class="notice">Es sind noch keine Getränke eingetragen.</p>';
    return chips + `
      <div class="grid" role="radiogroup" aria-label="Getränk">
        ${team.coffees.map(c => `<button type="button" class="choice" role="radio" aria-checked="${c.id === sel.coffeeId}" data-pick="coffee" data-id="${c.id}"><span>${esc(c.name)}</span><span class="choice-sub">${euro(c.price)}</span>${c.id === fav ? `<span class="fav">${ICON.star}Lieblingsgetränk</span>` : ''}</button>`).join('')}
      </div>`;
  }

  function mineHtml() {
    const timeOf = o => { const b = team.pauses.find(x => x.id === o.pauseId); return b ? b.time : '99:99'; };
    const list = mine.slice().sort((a, b) => timeOf(a).localeCompare(timeOf(b)) || a.erstellt - b.erstellt);
    const rows = list.map(o => {
      const c = team.coffees.find(x => x.id === o.coffeeId);
      const p = team.people.find(x => x.id === o.personId);
      const b = team.pauses.find(x => x.id === o.pauseId);
      const done = o.status === 'fertig';
      const when = b ? `Pause ${clock(b.time)} Uhr` : o.pauseId ? 'Pause entfernt' : 'ohne Pause';
      const who = mode === 'link' ? (o.quelle === 'admin' ? 'von der Kaffeekasse eingetragen' : '') : (p ? p.name : '');
      return `
        <li class="mine-row">
          <span class="mine-main">
            <strong>${esc(c ? c.name : 'Getränk')}</strong>
            <span class="mine-sub">${[who, when].filter(Boolean).map(esc).join(' · ')}</span>
          </span>
          <span class="status ${done ? 'fertig' : 'offen'}">${done ? ICON.checkSmall + 'fertig' : 'offen'}</span>
          ${done ? '' : `<button class="btn small ghost" data-act="cancel" data-id="${o.id}">Stornieren</button>`}
        </li>`;
    }).join('');
    return `<h2>Meine Bestellungen heute</h2>${rows ? `<ul class="mine">${rows}</ul>` : '<p class="empty">Noch nichts bestellt.</p>'}`;
  }

  // Pause mit freien Plätzen ("noch 3 von 8 frei"); volle Pausen sind ausgegraut und nicht wählbar
  function pauseChoiceHtml(b) {
    const full = isFull(b);
    const left = seatsLeft(b);
    const seats = b.limit > 0 ? (full ? 'ausgebucht' : `noch ${left} von ${b.limit} frei`) : '';
    return `<button type="button" class="choice${full ? ' full' : ''}" role="radio" aria-checked="${b.id === sel.pauseId}"${full ? ' disabled aria-disabled="true"' : ''} data-pick="pause" data-id="${b.id}">` +
      `<span>${clock(b.time)} Uhr</span><span class="choice-sub">${b.name ? esc(b.name) : '&nbsp;'}</span>` +
      `${seats ? `<span class="seats${!full && left <= 2 ? ' few' : ''}">${seats}</span>` : ''}</button>`;
  }

  function render() {
    if (!team || !mode) return;
    const ups = upcoming();
    const chosen = ups.find(b => b.id === sel.pauseId);
    if (sel.pauseId && !chosen) { sel.pauseId = null; sel.pauseAuto = true; } // Pause ist vorbei
    if (chosen && isFull(chosen)) {
      if (!sel.pauseAuto) fullNotice = `Die Pause um ${clock(chosen.time)} Uhr ist inzwischen ausgebucht – bitte eine andere wählen.`;
      sel.pauseId = null;
    }
    if (!sel.pauseId && sel.pauseAuto) { const free = available(); sel.pauseId = free.length ? free[0].id : null; } // nächste freie Pause
    if (sel.personId && !person()) sel.personId = null;
    if (sel.coffeeId && !coffee()) sel.coffeeId = null;
    const button = orderButton();
    const personal = mode === 'link';
    const n = personal ? 0 : 1;
    app.innerHTML = `
      <header class="bar"><h1 class="brand"><span class="brand-icon">${ICON.cup}</span>Kaffee bestellen</h1></header>
      ${personal ? helloHtml() : ''}
      ${success ? `<div class="success" role="status">${ICON.check}<span>${esc(success)}</span></div>` : ''}
      ${personal ? '' : `
      <section class="card">
        <h2><span class="step">1</span>Wer bist du?</h2>
        ${personHtml()}
      </section>`}
      <section class="card">
        <h2><span class="step">${n + 1}</span>Was möchtest du?</h2>
        ${coffeesHtml()}
      </section>
      <section class="card">
        <h2><span class="step">${n + 2}</span>Für welche Pause?</h2>
        ${ups.length ? `
        <div class="grid" role="radiogroup" aria-label="Pause">
          ${ups.map(pauseChoiceHtml).join('')}
        </div>
        ${!available().length ? '<p class="notice warn">Alle Pausen für heute sind ausgebucht.</p>' : ''}
        ${fullNotice ? `<p class="notice warn" role="alert" id="fullNotice">${esc(fullNotice)}</p>` : ''}` : '<p class="notice">Heute steht keine Pause mehr an. Morgen kannst du wieder bestellen.</p>'}
      </section>
      <div class="order-bar">
        <button class="btn primary block big" id="orderBtn" data-act="order" ${button.ready ? '' : 'disabled'}>${esc(button.label)}</button>
      </div>
      <section class="card" id="mine">${mineHtml()}</section>
      ${personal ? '' : '<p class="foot"><button class="link" data-act="change-code">Team-Code ändern</button></p>'}`;
  }

  // Ist die Pause (laut Server) voll? Für die Meldung, falls die Regeln eine Bestellung ablehnen
  async function pauseIsFull(b, datum) {
    try {
      const [c, pz] = await Promise.all([getDoc(doc(db, 'zaehler', `${datum}_${b.id}`)), getDoc(doc(db, ...pauseBase(), b.id))]);
      const limit = pz.exists() && Number.isInteger(pz.get('limit')) ? pz.get('limit') : 0;
      return limit > 0 && c.exists() && c.get('anzahl') >= limit;
    } catch (e) {
      return false;
    }
  }

  async function placeOrder() {
    if (sending || !orderButton().ready) return;
    const p = person(), c = coffee(), b = pause();
    if (!navigator.onLine) {
      toast('Keine Internetverbindung – bitte gleich noch einmal versuchen.', { error: true });
      return;
    }
    const duplicate = mine.some(o => o.status === 'offen' && o.personId === p.id && o.coffeeId === c.id && o.pauseId === b.id);
    if (duplicate && !(await confirmDialog({
      title: 'Noch einmal bestellen?',
      html: mode === 'link'
        ? `Du hast schon ein ${esc(c.name)} für die Pause um ${clock(b.time)} Uhr bestellt.`
        : `Für <strong>${esc(p.name)}</strong> ist schon ein ${esc(c.name)} für die Pause um ${clock(b.time)} Uhr bestellt.`,
      confirmText: 'Ja, noch einen',
    }))) return;
    sending = true;
    fullNotice = '';
    const btn = $('#orderBtn');
    btn.disabled = true;
    btn.textContent = 'Wird gesendet …';
    const datum = dateKey(new Date());
    const counterRef = doc(db, 'zaehler', `${datum}_${b.id}`);
    const orderRef = doc(collection(db, 'bestellungen'));
    try {
      // Platz belegen und Bestellung anlegen – beides oder nichts. Schicken zwei Kollegen gleichzeitig
      // die letzte freie Bestellung ab, wiederholt Firestore die zweite Transaktion mit dem neuen Stand.
      await runTransaction(db, async tx => {
        const snap = await tx.get(counterRef);
        const taken = snap.exists() ? snap.get('anzahl') : 0;
        const live = team.pauses.find(x => x.id === b.id) || b;
        if (live.limit > 0 && taken >= live.limit) throw Object.assign(new Error('ausgebucht'), { code: 'ausgebucht' });
        tx.set(counterRef, { datum, pauseId: b.id, anzahl: taken + 1, letzte: orderRef.id });
        tx.set(orderRef, {
          personId: p.id, sorteId: c.id, pauseId: b.id, datum, uid,
          status: 'offen', quelle: 'kollege', erstellt: serverTimestamp(), gezaehlt: true,
        });
      });
      success = `${c.name} für die Pause um ${clock(b.time)} Uhr bestellt`;
      sel.coffeeId = null; // verhindert versehentliches Doppelt-Bestellen
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) { /* ignorieren */ } }
      sending = false;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      toast(success);
    } catch (e) {
      const full = e.code === 'ausgebucht' || (e.code === 'permission-denied' && await pauseIsFull(b, datum));
      sending = false;
      if (full) {
        const msg = `Leider ist die Pause um ${clock(b.time)} Uhr inzwischen ausgebucht`;
        fullNotice = `${msg}. Die Bestellung wurde nicht angelegt – bitte eine andere Pause wählen.`;
        success = '';
        if (sel.pauseId === b.id) sel.pauseId = null;
        sel.pauseAuto = false;
        render();
        toast(msg, { error: true });
      } else if (e.code === 'permission-denied') {
        toast('Bestellen war nicht möglich – die Auswahl wird aktualisiert.', { error: true });
        reopen();
      } else {
        render();
        toast('Bestellung fehlgeschlagen. Bitte erneut versuchen.', { error: true });
      }
    }
  }

  async function cancelOrder(id) {
    const order = mine.find(o => o.id === id);
    if (!order || order.status !== 'offen') return;
    const c = team.coffees.find(x => x.id === order.coffeeId);
    const b = team.pauses.find(x => x.id === order.pauseId);
    const ok = await confirmDialog({
      title: 'Bestellung stornieren?',
      html: `${esc(c ? c.name : 'Getränk')}${b ? ` für die Pause um ${clock(b.time)} Uhr` : ''} wird storniert.`,
      confirmText: 'Stornieren',
      danger: true,
    });
    if (!ok) return;
    try {
      // Stornieren und den Platz in der Pause wieder freigeben – in einer Transaktion
      const ref = doc(db, 'bestellungen', id);
      await runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const x = snap.data();
        if (x.gezaehlt === true) {
          const counterRef = doc(db, 'zaehler', `${x.datum}_${x.pauseId}`);
          const counter = await tx.get(counterRef);
          if (counter.exists() && counter.get('anzahl') > 0) {
            tx.set(counterRef, { datum: x.datum, pauseId: x.pauseId, anzahl: counter.get('anzahl') - 1, letzte: id });
          }
        }
        tx.delete(ref);
      });
      success = '';
      toast('Bestellung storniert');
    } catch (e) {
      toast(e.code === 'permission-denied' ? 'Nicht mehr möglich – das Getränk ist schon fertig.' : 'Stornieren fehlgeschlagen.', { error: true });
    }
  }

  // ---------- Ereignisse ----------
  app.addEventListener('click', async e => {
    const pickEl = e.target.closest('[data-pick]');
    if (pickEl) {
      const { pick, id } = pickEl.dataset;
      if (pick === 'person') {
        sel.personId = id;
        sel.changingPerson = false;
        store.set(PERSON_KEY, id);
      } else if (pick === 'coffee') {
        sel.coffeeId = id;
      } else {
        const b = team.pauses.find(x => x.id === id);
        if (!b || isFull(b)) return;
        sel.pauseId = id;
        sel.pauseAuto = false;
      }
      success = '';
      fullNotice = '';
      render();
      return;
    }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    switch (act.dataset.act) {
      case 'order': placeOrder(); break;
      case 'cancel': cancelOrder(act.dataset.id); break;
      case 'change-person': sel.changingPerson = true; render(); break;
      case 'reload': location.reload(); break;
      case 'change-code':
        if (await confirmDialog({ title: 'Team-Code ändern?', html: 'Danach musst du den Team-Code neu eingeben.', confirmText: 'Code eingeben' })) {
          store.set(CODE_KEY, null);
          showCodeForm();
        }
        break;
    }
  });

  app.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'codeForm') submitCode();
  });

  app.addEventListener('input', e => {
    if (e.target.id !== 'search') return;
    const q = e.target.value.trim().toLocaleLowerCase('de');
    app.querySelectorAll('[data-pick=person]').forEach(b => { b.hidden = !b.dataset.name.includes(q); });
  });

  // Neuer Team-Link (…#code=…) in der bereits geöffneten Seite; mit persönlichem Link ohne Bedeutung
  window.addEventListener('hashchange', () => {
    const linked = codeFromLink();
    if (!linked) return;
    store.set(CODE_KEY, linked);
    if (uid && mode !== 'link' && !key) openTeam(linked);
  });

  // Beim Zurückkehren: neuer Tag, geänderte Daten, vergangene Pausen
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !team || !mode || sending) return;
    if (dateKey(new Date()) !== day || Date.now() - loadedAt > RELOAD_AFTER) reopen(true);
    else render();
  });
  setInterval(() => {
    if (document.hidden || !team || !mode || sending || dlg.open) return;
    const ids = upcoming().map(b => b.id).join();
    if (ids !== app.dataset.pauses) render();
    app.dataset.pauses = ids;
  }, 30000);

  start();
})();
</script>

</body>
</html>
